<title>Kolvik Station</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
<!-- @css -->
</style>

<div id="hub">
  <header class="top gut">
    <div class="brand">
      <div class="mark">KOLVIK <em>STATION</em></div>
      <div class="read" id="readout">71°04′N 24°18′E · Ambient −31 °C · Hideout</div>
    </div>
    <div class="topr">
      <button class="musicbtn" id="accBtn" hidden>Sign in</button>
      <button class="musicbtn" id="dbgBtn" hidden title="Debug tools (F9)">Debug</button>
      <button class="musicbtn" id="optBtn">Settings</button>
      <button class="musicbtn" id="tipsBtn" title="Show the tips on every tab again">Tips</button>
      <button class="musicbtn" id="musicBtn" aria-pressed="false">♪ Music off</button>
      <button class="musicbtn" id="nextBtn" hidden aria-label="Next track">Next ›</button>
      <div class="bal"><span class="lbl">Cash</span><b id="cashv">$0</b></div>
    </div>
  </header>
  <nav class="tabs gut" role="tablist" id="tabs">
    <button role="tab" data-tab="gear" aria-selected="true">Stash &amp; gear</button>
    <button role="tab" data-tab="trader" aria-selected="false">Trader</button>
    <button role="tab" data-tab="tasks" aria-selected="false">Tasks<span class="badge" id="taskBadge" hidden></span></button>
    <button role="tab" data-tab="goals" aria-selected="false">Goals<span class="badge" id="goalBadge" hidden></span></button>
    <button role="tab" data-tab="hideout" aria-selected="false">Hideout</button>
    <button role="tab" data-tab="operator" aria-selected="false">Operator<span class="badge" id="cacheBadge" hidden></span></button>
    <button role="tab" data-tab="rec" aria-selected="false">Rec room</button>
    <button role="tab" data-tab="deploy" aria-selected="false">Deploy<span class="badge" id="chatBadge" hidden></span></button>
    <button role="tab" data-tab="friends" aria-selected="false" id="friendsTab" hidden>Friends<span class="badge" id="socialBadge" hidden></span></button>
    <button role="tab" data-tab="board" aria-selected="false" id="boardTab" hidden>Leaderboard</button>
  </nav>
  <div id="guestBar" class="gut" hidden></div>
  <main id="tabbody" class="gut"></main>
</div>

<div id="raid" hidden>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="compass"></div><div id="timer"></div><div id="exlist"></div><div id="log"></div>
    <div id="scope" hidden></div><div id="prismRing" hidden></div><div id="reticle" hidden></div>
    <div id="mates"></div><div id="hitdirs"></div><div id="bossbar" hidden></div><div id="flashwhite" hidden></div><div id="tdhud" hidden></div><div id="pdhud" hidden></div><div id="dmhud" hidden></div><div id="racehud" hidden></div><div id="airhud" hidden></div><div id="tvhud" hidden></div><div id="aimdot" hidden></div><div id="cross"></div><div id="hitm"></div><div id="prompt"></div><div id="center"></div>
    <div id="bodyhud"><div class="fig" id="fig"></div><div class="vit" id="vit"></div></div>
    <div id="weph"></div>
    <div id="taskHud"></div>
    <div id="gpsline" hidden></div><canvas id="minimap" width="168" height="168" hidden></canvas>
    <div id="rchat"></div>
    <form id="rchatForm" hidden autocomplete="off"><span id="rchatCh">ALL</span><input id="rchatIn" maxlength="200" aria-label="Raid chat" placeholder="Enter sends · Tab switches channel · @name messages a friend · Esc cancels"></form>
    <div id="vign"></div><div id="cold"></div><div id="deathfade"></div>
    <div id="spec" hidden></div>
    <div id="deathcard" hidden></div>
  </div>
  <div id="rinv" hidden></div>
  <div class="overlay" id="brief" hidden></div>
  <div class="overlay" id="pause" hidden></div>
  <div id="gpsmap" hidden></div>
</div>
<div id="result" hidden></div>
<div class="overlay" id="accModal" hidden></div>
<div class="overlay" id="optModal" hidden></div>
<div class="overlay" id="cacheModal" hidden></div>
<div id="toast" role="status"></div>
<div class="invites" id="invites" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE) document.write('<script src="vendor/three.min.js"><\/script>');</script>

</script>
