function afterChange(){ if(!R) saveGame(); refreshInv(); }
function refreshInv(){ if(R){ if(R.invOpen) renderRaidInv(); } else renderTab(); }

// locate an item: returns {key} for grid or {slot}
function locate(it){
  for(const s of [...SLOTS,'pockets','pouch']) if(S.eq[s]===it) return {slot:s};
  const keys=['stash','eq:pockets','eq:rig','eq:pack','eq:pouch']; if(R&&R.lootTarget) keys.push('loot');
  for(const k of keys){ if(k==='stash'&&R) continue; const c=getCont(k); if(c&&c.items.includes(it)) return {key:k}; }
  return null;
}
function removeAt(loc,it){ if(loc.slot){ S.eq[loc.slot]=null; } else { const c=getCont(loc.key); const i=c.items.indexOf(it); if(i>=0) c.items.splice(i,1); } }
function playerConts(){ return ['rig','pockets','pack','pouch'].map(s=>S.eq[s]).filter(Boolean).map(contOf); }
function inPlayer(it){ return playerConts().some(c=>c.items.includes(it)); }
function addToPlayer(it){ for(const c of playerConts()){ if(c===undefined) continue; if(place(c,it)) return true; } return false; }

function quickAction(it, loc){
  const d=ITEMS[it.id];
  if(R){
    if(loc.key==='loot'){ if(it.items&&it.items.length){ toast('Empty it first.'); return; } removeAt(loc,it); if(!addToPlayer(it)){ R.lootTarget.cont.items.push(it); toast('No room in your rig, pockets or pack.'); } else { netTake(it); sfxPickup(); } }
    else if(R.lootTarget && loc.key){ if(R.lootTarget.mate){ toast('You can only take from a downed squadmate.'); return; } removeAt(loc,it); if(!place(R.lootTarget.cont,it)){ getCont(loc.key).items.push(it); toast('No room in the container.'); } else netPut(it); }
    else if((d.type==='med'||d.type==='warm') && loc.key) { startUse(it); return; }
    refreshInv(); return;
  }
  if(loc.key==='stash'){
    if(d.slot && !d.fixed && !S.eq[d.slot]){ removeAt(loc,it); S.eq[d.slot]=it; it.r=0; }
    else { removeAt(loc,it); if(!addToPlayer(it)){ S.stash.items.push(it); toast('No room in your loadout.'); } }
  } else {
    if(it.items&&it.items.length===0 || !it.items){ removeAt(loc,it); if(!place(S.stash,it)){ if(loc.slot) S.eq[loc.slot]=it; else getCont(loc.key).items.push(it); toast('Stash is full.'); } }
    else { removeAt(loc,it); if(!placeNoMerge(S.stash,it)){ S.eq[loc.slot]=it; toast('Stash is full.'); } }
  }
  afterChange();
}

/* ---------- drag & drop ---------- */
let drag=null, lastTap={uid:null,t:0};
const cellPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 46;
function bindItem(el,it,src){
  el.addEventListener('pointerdown',ev=>{
    if(ev.button!==0||it.hid) return; ev.preventDefault();
    const r=el.getBoundingClientRect(), c=cellPx(); const [w,h]=dims(it);
    drag={it,src,el,sx:ev.clientX,sy:ev.clientY,started:false,r:it.r,gx:src.slot?0:clamp(Math.floor((ev.clientX-r.left)/c),0,w-1),gy:src.slot?0:clamp(Math.floor((ev.clientY-r.top)/c),0,h-1),ghost:null,prev:null};
  });
}
function ghostDims(){ const d=ITEMS[drag.it.id]; return drag.r?[d.h,d.w]:[d.w,d.h]; }
function startGhost(){
  drag.started=true; drag.el.classList.add('dragging');
  const g=itemEl(drag.it,false); g.classList.add('dragghost'); g.classList.remove('sel'); drag.ghost=g; sizeGhost(); document.body.appendChild(g);
}
function sizeGhost(){ const c=cellPx(); const [w,h]=ghostDims(); drag.ghost.style.width=(w*c-2)+'px'; drag.ghost.style.height=(h*c-2)+'px'; }
function moveGhost(x,y){
  const c=cellPx(); drag.ghost.style.transform=`translate(${x-(drag.gx+0.5)*c}px,${y-(drag.gy+0.5)*c}px)`;
  drag.lx=x; drag.ly=y;
  const t=document.elementFromPoint(x,y);
  document.querySelectorAll('.slot.dropok').forEach(s=>s.classList.remove('dropok'));
  if(drag.prev){ drag.prev.remove(); drag.prev=null; }
  if(!t) return;
  const gEl=t.closest('[data-grid]'), sEl=t.closest('[data-slot]');
  if(gEl){ const cont=getCont(gEl.dataset.grid); if(!cont) return; const rect=gEl.getBoundingClientRect(); const tx=Math.floor((x-rect.left-1)/c)-drag.gx, ty=Math.floor((y-rect.top-1)/c)-drag.gy;
    const [w,h]=ghostDims(); const ok=fitsAt(cont,drag.it,tx,ty,drag.r,drag.it) || stackTarget(cont,x,y,rect,c);
    const p=document.createElement('div'); p.className='preview'+(ok?'':' bad'); p.style.cssText=`left:${tx*c+1}px;top:${ty*c+1}px;width:${w*c-1}px;height:${h*c-1}px`; gEl.appendChild(p); drag.prev=p; }
  else if(sEl){ const d=ITEMS[drag.it.id]; if(d.slot===sEl.dataset.slot && !S.eq[d.slot]) sEl.classList.add('dropok'); }
}
function stackTarget(cont,x,y,rect,c){ const d=ITEMS[drag.it.id]; if(!d.stack) return null; const o=itemAt(cont,Math.floor((x-rect.left-1)/c),Math.floor((y-rect.top-1)/c)); return (o&&o!==drag.it&&o.id===drag.it.id&&o.n<d.stack&&!o.hid)?o:null; }
function rotateDrag(){ if(!drag||!drag.started) return; drag.r^=1; [drag.gx,drag.gy]=[drag.gy,drag.gx]; sizeGhost(); moveGhost(drag.lx,drag.ly); }
function cancelDrag(){ if(!drag) return; if(drag.ghost) drag.ghost.remove(); if(drag.prev) drag.prev.remove(); if(drag.el) drag.el.classList.remove('dragging'); drag=null; }
document.addEventListener('pointermove',ev=>{ if(!drag) return; if(!drag.started){ if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<5) return; startGhost(); } moveGhost(ev.clientX,ev.clientY); });
document.addEventListener('pointerup',ev=>{
  if(!drag) return; const d=drag;
  if(!d.started){ drag=null; const now=performance.now(); if(lastTap.uid===d.it.uid && now-lastTap.t<380){ lastTap.uid=null; quickAction(d.it,d.src); } else { lastTap={uid:d.it.uid,t:now}; SEL={it:d.it}; document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel')); d.el.classList.add('sel'); renderInfo(document.querySelector(R?'#rinfo':'#info')); } return; }
  const res=tryDrop(ev.clientX,ev.clientY); cancelDrag(); if(res&&res.msg) toast(res.msg); if(res&&res.ok){ SEL={it:d.it}; afterChange(); } else refreshInv();
});
document.addEventListener('pointercancel',()=>{ cancelDrag(); refreshInv(); });
function tryDrop(x,y){
  if(drag.prev){ drag.prev.remove(); drag.prev=null; }
  const t=document.elementFromPoint(x,y); if(!t) return null;
  const it=drag.it, d=ITEMS[it.id], src=drag.src;
  const gEl=t.closest('[data-grid]'), sEl=t.closest('[data-slot]'), sell=t.closest('[data-sell]'), disc=t.closest('[data-discard]');
  if(gEl){
    const key=gEl.dataset.grid, cont=getCont(key); if(!cont) return null; const c=cellPx(); const rect=gEl.getBoundingClientRect();
    if(gridOwner(key)===it) return {msg:"A container can't go inside itself."};
    if(it.items&&it.items.length&&key!=='stash') return {msg:'Empty it first.'};
    if(R&&key==='loot'&&src.key!=='loot'&&R.lootTarget&&R.lootTarget.mate) return {msg:"You can only take from a downed squadmate."};
    const st=stackTarget(cont,x,y,rect,c);
    if(st){ const mv=Math.min(it.n,d.stack-st.n); st.n+=mv; it.n-=mv; if(it.n<=0){ removeAt(src,it); if(R&&src.key==='loot'&&key!=='loot') netTake(it); } return {ok:true}; }
    const tx=Math.floor((x-rect.left-1)/c)-drag.gx, ty=Math.floor((y-rect.top-1)/c)-drag.gy;
    if(!fitsAt(cont,it,tx,ty,drag.r,it)) return {msg:'No room there.'};
    removeAt(src,it); it.x=tx; it.y=ty; it.r=drag.r; cont.items.push(it);
    if(R&&NET.on){ if(src.key==='loot'&&key!=='loot') netTake(it); else if(key==='loot'&&src.key!=='loot') netPut(it); }
    return {ok:true};
  }
  if(sEl){ const slot=sEl.dataset.slot; if(src.slot===slot) return null; if(d.slot!==slot) return {msg:`${d.name} doesn't go in the ${SLOT_NAME[slot].toLowerCase()} slot.`}; if(S.eq[slot]) return {msg:'That slot is taken. Move the current item out first.'}; removeAt(src,it); S.eq[slot]=it; it.r=0; return {ok:true}; }
  if(sell && !R){ if(src.key!=='stash') return {msg:'Sell from your stash.'}; sellItem(it,src); return null; }
  if(disc && R){ if(it.items&&it.items.length) return {msg:'Empty it first.'}; removeAt(src,it); if(src.key==='loot') netTake(it); dropToGround(it); return {ok:true}; }

}

function haulItems(){

  return out;
}
function haulToStash(){ let moved=0,left=0; for(const [sl,it] of haulItems()){ const c=contOf(S.eq[sl]); c.items.splice(c.items.indexOf(it),1); const ok=(it.items&&it.items.length)?placeNoMerge(S.stash,it):place(S.stash,it); if(ok) moved++; else { c.items.push(it); left++; } } return {moved,left}; }

/* 57-ai: how enemies think. Runs only where the AI runs (solo, or the online AI host).

   1. BELIEF: sensor fusion with a particle filter. For every player the enemies know about there is one shared
      "radio picture": AI.N particles, each a guess at where that player is and how they are moving.
      - predict: every guess keeps moving the way it was going, with random turns and stops, and only through
        walkable ground (the nav grid), so the cloud flows down corridors and around buildings
      - sight: a strong clue; guesses far from what was seen die out, and the survivors take on the velocity the
        tracker measured, so the cloud keeps running the way you were running when you broke line of sight
      - footsteps and gunfire: weaker clues, noisier with distance
      - being shot: a bearing only (where it came from, not how far)
      - looking and not seeing: guesses inside an alert enemy's view lose most of their weight, so the cloud empties
        out of every place they have checked
      Resampling keeps the cloud on the plausible guesses. The densest 4 m patch is the best estimate, and the next
      few dense patches are places worth searching.
   2. TRACKING: an alpha-beta filter (a light Kalman filter) on sightings gives position and velocity, for aiming
      where you will come back out and seeding the cloud's motion.
   3. TACTICS: each enemy scores its options (engage, cover, suppress, hold the angle, flank, search, retreat) and
      takes the best. Flanking routes use A* with an exposure cost (cells the threat can see are expensive); cover is
      a breadth-first search for a cell the threat can't see, next to one it can (a corner to peek from).

      suppression, search focus, peeking, comms). After a raid every genome that fought is scored on how it did
      against you, and the population breeds: elites kept, tournament selection, blend crossover, mutation. It is
      saved in this browser (the AI host's), so the enemies keep adapting to how you play. Accuracy and reaction time
      are never evolved, only behaviour.

   5. WHO KNOWS WHAT: enemies are in groups (whoever spawned together). A group shares one picture; other groups only
      know what reaches them: a shout carries about 18 m, and raiders, guards and the like carry radios. A radio
      report arrives a couple of seconds late and only says roughly where (±8 m), and the group that hears it sends at
      most one or two people to check while the rest just get wary (they look that way and notice you sooner). Across
      the whole map only a few are ever sent at once, so a sighting doesn't pull every enemy onto you. A radio jammer
      in your gear cuts reports (and drone links) within 40 m of you.

// a dead comrade: who did it is a fair guess (it's whoever is in the raid), where they shot from is not, so the

function aiSeedBody(e,c){

/* ---------------- adaptation: the genetic algorithm ---------------- */
const GA={key:'kolvik-ai-v1', size:12, elite:2, mut:0.12, mutP:0.35};
function gaLoad(){ if(GA.data) return GA.data; let d=null; try{ d=JSON.parse(localStorage.getItem(GA.key)||'null'); }catch(e){}
  if(!d||d.v!==1) d={v:1,pops:{}}; GA.data=d; return d; }
function gaSave(){ try{ localStorage.setItem(GA.key,JSON.stringify(GA.data)); }catch(e){} }
function gaPop(name){ const d=gaLoad(); let p=d.pops[name]; if(!p){ p=d.pops[name]={gen:1,ind:[],best:null,history:[]};
  for(let i=0;i<GA.size;i++){ const g={}; for(const k of GENES) g[k]=clamp(0.5+_gauss()*0.18,0,1); p.ind.push({g,fs:0,n:0}); } } return p; }
const gaPopName=k=>k==='scav'?'scav':'trained';
// a genome for a new enemy: untested ones first, otherwise a tournament on average fitness
function gaPick(kind){ if(EK[kind]&&EK[kind].boss) return null; if(OPTS.aiLearn==='off'||(NET.on&&!NET.host)) return null;
  const name=gaPopName(kind), p=gaPop(name); const fresh=p.ind.map((x,i)=>i).filter(i=>p.ind[i].n===0);
  let i; if(fresh.length&&Math.random()<0.7) i=fresh[Math.floor(Math.random()*fresh.length)];
  else { const a=Math.floor(Math.random()*p.ind.length), c=Math.floor(Math.random()*p.ind.length), fa=p.ind[a].n?p.ind[a].fs/p.ind[a].n:0, fc=p.ind[c].n?p.ind[c].fs/p.ind[c].n:0; i=fa>=fc?a:c; }
  return {pop:name,i,gen:p.gen,g:Object.assign({},p.ind[i].g)}; }
// how well an enemy did against you this raid
function gaFitness(e,killer){ return (e.dmgDone||0)+(killer?150:0)+Math.min(e.engT||0,120)*0.4+(e.seeT||0)*0.3+(e.dead?Math.min(e.lifeEng||0,30)*0.3-15:12); }
// after a raid: score every genome that fought, then breed the next generation when everyone has been tried
function gaRaidEnd(kind){
  if(!R||OPTS.aiLearn==='off'||(NET.on&&!NET.host)) return; const d=gaLoad(); let any=false;
  const killer=kind==='kia'&&R.lastShooter&&!R.lastShooter.dead?R.lastShooter:(kind==='kia'?R.lastShooter:null);
  for(const e of R.enemies){ if(!e.gen||(e.engT||0)<3) continue; const p=d.pops[e.gen.pop]; if(!p||p.gen!==e.gen.gen) continue; const ind=p.ind[e.gen.i]; if(!ind) continue;
    ind.fs+=gaFitness(e,e===killer); ind.n++; any=true; }
  if(!any) return; for(const name in d.pops){ const p=d.pops[name]; const tried=p.ind.filter(x=>x.n>0).length; if(tried>=p.ind.length-1&&p.ind.reduce((s,x)=>s+x.n,0)>=p.ind.length*1.5) gaEvolve(p); }
  gaSave();
}
function gaEvolve(p){
  const mean=x=>x.n?x.fs/x.n:-1e9; const sorted=p.ind.slice().sort((a,c)=>mean(c)-mean(a)); const med=mean(sorted[Math.floor(sorted.length/2)]);
  for(const x of p.ind) if(!x.n){ x.fs=med; x.n=1; }
  const tour=()=>{ let best=null; for(let k=0;k<3;k++){ const c=p.ind[Math.floor(Math.random()*p.ind.length)]; if(!best||mean(c)>mean(best)) best=c; } return best; };
  const next=sorted.slice(0,GA.elite).map(x=>({g:Object.assign({},x.g),fs:x.fs/x.n,n:1}));    // elites carry a damped record forward
  while(next.length<GA.size){ const a=tour(), c=tour(), g={};
    for(const k of GENES){ const lo=Math.min(a.g[k],c.g[k]), hi=Math.max(a.g[k],c.g[k]), ext=(hi-lo)*0.25; let v=lo-ext+Math.random()*(hi-lo+2*ext);   // blend crossover (BLX-0.25)
      if(Math.random()<GA.mutP) v+=_gauss()*GA.mut; g[k]=clamp(v,0,1); }
    next.push({g,fs:0,n:0}); }
  p.history.push({gen:p.gen,best:+mean(sorted[0]).toFixed(1),avg:+(p.ind.reduce((s,x)=>s+mean(x),0)/p.ind.length).toFixed(1),genes:Object.fromEntries(GENES.map(k=>[k,+(p.ind.reduce((s,x)=>s+x.g[k],0)/p.ind.length).toFixed(2)]))}); if(p.history.length>40) p.history.shift();
  p.best={g:Object.assign({},sorted[0].g),fit:+mean(sorted[0]).toFixed(1),gen:p.gen}; p.ind=next; p.gen++;
}
function gaReset(){ GA.data={v:1,pops:{}}; gaSave(); }
// turn genes into concrete behaviour numbers on a new enemy (within fair limits)
function aiApplyGenes(e){ const G=aiGenes(e); e.pref=e.pref*(1.35-0.7*G.aggr); if(!e.k.home) e.role=Math.random()<0.25+0.6*G.aggr?'rush':'hold'; e.callMul=0.7+0.8*G.comms; }

/* ---------------- a dead comrade ---------------- */
// a calm enemy that can see a body of one of its own reacts to it (once per body per enemy)
function aiBodyScan(e){
  if(R.t<(e.bodyT||0)) return; e.bodyT=R.t+0.6; const range=Math.min(40,aiSightRange(e)*0.6), fx=-Math.sin(e.yaw), fz=-Math.cos(e.yaw);
  for(const c of R.conts){ if(!c.ally||(c.seenBy&&c.seenBy.has(e))) continue; const dx=c.x-e.pos.x, dz=c.z-e.pos.z, d=Math.hypot(dx,dz); if(d>range) continue;
    if(d>4&&(fx*dx+fz*dz)/d<(e.aware>R.t?-0.2:0.25)) continue;
    if(!los(e.pos.x,e.pos.y+eEye(e),e.pos.z,c.x,(R.terrain?R.terrain(c.x,c.z):0)+0.35,c.z)) continue;
    (c.seenBy||(c.seenBy=new Set())).add(e);
    if(c.found&&R.t-c.found>25){ e.aware=R.t+60; e.awareAt={x:c.x,z:c.z}; continue; }   // an old one, already called in: just wary
    c.found=c.found||R.t; aiDiscoverBody(e,c); return; }
}
function aiDiscoverBody(e,c){
  e.state='combat'; e.lostT=0; e.react=0.4; e.susp={x:c.x,z:c.z,t:R.t,phase:'go'}; e.mode='search'; e.goal=null; e.lastSeen={x:c.x,z:c.z}; e.lastSeen0=false;
  aiSeedBody(e,c); e.aware=R.t+90; e.awareAt={x:c.x,z:c.z};
  // the rest of the group close by come with them; other groups hear "man down" on the radio and get wary, but nobody new is sent
  for(const o of R.enemies) if(o!==e&&!o.dead&&o.grp===e.grp&&o.state!=='combat'&&Math.hypot(o.pos.x-e.pos.x,o.pos.z-e.pos.z)<30){ o.state='combat'; o.tid=e.tid; o.lostT=0; o.react=0.5; o.mode='search'; o.goal=null; o.aware=R.t+90; o.awareAt={x:c.x,z:c.z}; }
  aiRadio(e,e.tid,c.x,c.z,{sig:14,send:0,kind:'mandown'});
  if(typeof speak==='function') speak(e.pos.x,e.pos.z,voiceOf(e),'call');
}
// walk over carefully, crouch by the body and look around, then hand over to the ordinary search
function suspAct(e,dt){
  const s=e.susp, T=R.t-s.t;
  if(s.phase==='go'){ const d=Math.hypot(s.x-e.pos.x,s.z-e.pos.z); if(d>2.4&&T<14){ eMove(e,s.x,s.z,2.2,dt); return true; } s.phase='check'; s.ct=R.t; s.yaw0=e.yaw; }
  if(s.phase==='check'){ const t2=R.t-s.ct; e.yaw=lerpA(e.yaw,s.yaw0+(t2<1.2?0:Math.sin((t2-1.2)*1.3)*1.6),Math.min(1,dt*4)); if(t2>5){ e.susp=null; e.mode='search'; e.goal=null; } return true; }
  return false;
}

/* 58-body: how people move. One procedural rig drives every humanoid() body: scavs, bosses, other players and the
   workshop previews.
   - Legs are two bones (thigh, shin) solved with IK, so a foot on the ground stays put while the body passes over it
     instead of sliding. The gait blends from a walk (long ground contact, small lift) to a run (short contact, high
     knee) with speed, and the stride lengthens with speed the way people's does.
   - The hips turn toward where the body is going while the chest keeps facing where it looks, so strafing and
     backpedalling read properly; the chest counter-twists against the hips on every step.
   - The pelvis rises over the planted leg when walking and bounces when running, sways over the standing foot, and
     the body leans forward with speed, into turns, and against sudden stops.
   - Crouching, aiming up and down, recoil, a reload (the left hand goes to the pouch), flinching from hits, a limp
     after a leg hit, idle breathing, weight shifts and looking around, shuffling the feet when turning on the spot,
     and a fall when killed (knees go, then the body drops away from the shot).
   The arms keep Jim's rest angle (ARM_PITCH in 53-enemies.js); aiming tilts the whole shoulder line, and only a
   reload moves an arm on its own.
   bodyAnim(rig, inp, dt) poses one body. humanoid() builds the rig. */
const BODY={
  thigh:0.44, shin:0.42, pelvis:0.9,      // bone lengths, pelvis height standing (m); the hip joints sit 4 cm below it
  stride:[1.3,2.2], strideK:0.42,          // a full stride (two steps) = clamp(0.75 + 0.42 × speed)
  duty:[0.6,0.38],                         // how much of a stride each foot is on the ground: walking, running
  lift:[0.09,0.2],                         // how high the swinging foot comes up: walking, running
  runAt:[2.0,3.2],                         // speeds (m/s) where the walk turns into a run
  lean:[0.05,0.2],                         // forward lean walking, running (radians)
  crouchDrop:0.4, crouchLean:0.26,         // crouched: how far the pelvis drops, how far the chest leans in
  hipTurn:0.7,                             // most the hips turn away from the chest toward the way they're going
  flinch:{k:140,d:13},                     // the spring a hit knocks the chest on
};
const _bsm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const _bwrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function bodyNew(){ return {ph:Math.random(),t:Math.random()*20,vx:0,vz:0,v:0,px:null,pz:null,lastYaw:null,yawRate:0,fwdV:0,acc:0,gw:0,run:0,crouch:0,hipY:0,aimP:0,headY:0,headP:0,
  recoil:0,fp:0,fvp:0,fr:0,fvr:0,dip:0,limp:0,limpLeg:0,lookT:0,lookY:0,shuffle:0,shPh:0,dying:-1,fallDir:1,fallRoll:0,fallY:0,skip:0}; }
// two-bone leg IK: put the foot at (tx,ty,tz) in the pelvis frame, measured from the hip joint
function bodyLeg(L,tx,ty,tz){
  const a=BODY.thigh, b=BODY.shin, r=Math.max(0.05,Math.hypot(tx,ty));
  L.hip.rotation.z=Math.atan2(tx,-ty);                       // swing the leg out to the side first (order ZXY)...
  let d=Math.hypot(r,tz); d=clamp(d,Math.abs(a-b)+0.08,a+b-0.002);
  const at=Math.atan2(-tz,r), a1=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1)), kn=Math.acos(clamp((a*a+b*b-d*d)/(2*a*b),-1,1));

}
const _bspring=(x,v,dt,k,d)=>{ const h=Math.min(dt,0.03); let n=Math.ceil(dt/h); while(n--){ v+=(-k*x-d*v)*h; x+=v*h; } return [x,v]; };

         vx,vz          optional world velocity; left out, it's measured from how far the body moved
         crouch         bool
         aim            pitch of the gun toward what they're aiming at (+ up), or null to hold level
         alert          in a fight: knees soft, no idle looking around

  // each time a foot comes down, count a step (34-voices.js plays it)

    if(s.shuffle>0&&!walking){ const u=(s.shPh+i*0.5)%1; if(u>0.5) l+=0.055*Math.sin((u-0.5)*2*Math.PI)*Math.min(1,s.shuffle*4); }

  hipH-=BODY.crouchDrop*s.crouch*(1-0.25*gw)+(inp.alert?0.03:0)+s.dip;
  hipH+=Math.sin(s.t*1.6)*0.004*(1-gw);                        // breathing
  if(sitting) hipH=0.5;
  const sway=Math.sin(s.ph*Math.PI*2)*0.028*gw*(1-run*0.5)+Math.sin(s.t*0.47)*0.018*(1-gw)*(inp.alert?0.4:1);
  rig.pelvis.position.set(sway,hipH+0.04,0); rig.spine.position.set(sway,hipH+0.04,0);
  for(let i=0;i<2;i++){ const L=i?rig.rl:rig.ll;
    if(sitting){ L.hip.rotation.set(1.45,0,i?-0.12:0.12); L.knee.rotation.x=-1.45; continue; }
    // feet sit under the hips (a touch wider when crouched) and ride along the stride
    const fx=off[i]*ux-sway*0.8+(i?1:-1)*0.04*s.crouch, fz=off[i]*uz-0.05*s.crouch, fy=-hipH+up[i];
    bodyLeg(L,fx,fy,fz); if(inp.down){ L.hip.rotation.x=0.15+i*0.25; L.knee.rotation.x=-0.3-i*0.4; } }

  const lean=(BODY.lean[0]+(BODY.lean[1]-BODY.lean[0])*run)*clamp(fwd/Math.max(v,0.5),-0.5,1)*gw;
  [s.fp,s.fvp]=_bspring(s.fp,s.fvp,dt,BODY.flinch.k,BODY.flinch.d); [s.fr,s.fvr]=_bspring(s.fr,s.fvr,dt,BODY.flinch.k,BODY.flinch.d);
  s.dip=Math.max(0,s.dip-dt*0.5); s.limp=Math.max(0,s.limp-dt); s.recoil=Math.max(0,s.recoil-dt*12);
  const tgtAim=inp.aim==null?0:clamp(inp.aim,-0.75,0.75); s.aimP+=(tgtAim-s.aimP)*Math.min(1,dt*8);
  const rl=inp.reload>=0?inp.reload:-1, rw=rl<0?0:rl<0.1?_bsm(rl/0.1):rl>0.85?_bsm((1-rl)/0.15):1;  // gun tilted in for the reload
  const pouch=rl<0?0:rl<0.12?0:rl<0.35?_bsm((rl-0.12)/0.23):rl<0.52?1:rl<0.75?_bsm((0.75-rl)/0.23):0;  // left hand down to the pouch and back
  const breath=Math.sin(s.t*1.6)*0.012*(1-gw);
  rig.spine.rotation.set(-lean-BODY.crouchLean*s.crouch-clamp(s.acc,-6,6)*0.012*(1-c)+s.fp+s.recoil*0.035+s.aimP*0.22+breath*0.5-(sitting?-0.05:0),
    -tw*0.07, clamp(s.yawRate*v*0.03,-0.22,0.22)-clamp(right,-4,4)*0.012*gw+s.fr+(limp?0.05*Math.sin(s.ph*Math.PI*2)*gw:0));
  // the gun and the shoulder line: aim, a little bounce on each step, recoil, and the reload tilt
  rig.aim.rotation.set(s.aimP*0.78+s.recoil*0.1+0.02*Math.sin(s.ph*Math.PI*4)*gw*(1-run*0.3)-0.22*rw-(inp.down?0.5:0),0.06*rw,0.02*Math.sin(s.ph*Math.PI*2)*gw+0.35*rw);

  if(!inp.alert&&inp.look==null){ s.lookT-=dt; if(s.lookT<=0){ s.lookT=1.5+Math.random()*4; s.lookY=Math.random()<0.45?0:(Math.random()-0.5)*(gw>0.5?0.9:1.5); } }
  else if(inp.look!=null) s.lookY=clamp(inp.look,-1,1); else s.lookY=0;
  s.headY+=(s.lookY-s.headY)*Math.min(1,dt*(inp.alert?8:3));
  rig.head.rotation.set(s.aimP*0.5-rig.spine.rotation.x*0.4+s.fp*0.6+breath,s.headY+tw*0.07,-rig.spine.rotation.z*0.5);
}
// a shot fired: the gun kicks
function bodyKick(rig){ if(rig) rig.s.recoil=1; }
// hit from (fx,fz): the chest is knocked away from the shot; a leg hit buckles the knee and leaves a limp
function bodyHit(rig,fx,fz,part){ if(!rig) return; const s=rig.s, g=rig.g;
  const dx=g.position.x-fx, dz=g.position.z-fz, d=Math.hypot(dx,dz)||1, y=g.rotation.y, sy=Math.sin(y), cy=Math.cos(y);
  const along=-(dx*sy+dz*cy)/d, side=(dx*cy-dz*sy)/d, k=part==='head'?5.5:part==='legs'?2:4;  // the bullet's way of travel, in the body's frame
  s.fvp-=along*k; s.fvr-=side*k*0.8;                      // shot from the front: the chest goes back; from the left: it goes right
  if(part==='legs'){ s.dip=0.09; s.limp=4; s.limpLeg=Math.random()<0.5?0:1; } }
// killed: the knees go, then the body falls away from the shot
function bodyDie(rig,fx,fz){ if(!rig) return; const s=rig.s, g=rig.g; if(s.dying>=0) return;
  let dir=1; if(fx!=null){ const dx=g.position.x-fx, dz=g.position.z-fz, f=-(dx*Math.sin(g.rotation.y)+dz*Math.cos(g.rotation.y)); dir=f<0?1:-1; }  // shot from the front: falls backwards
  s.dying=0; s.fallDir=dir; s.fallRoll=(Math.random()-0.5)*0.5; s.fallY=0; s.c0=s.crouch; }
function bodyFall(rig,dt){
  const s=rig.s, g=rig.g; s.dying+=dt; const T=s.dying;
  const buckle=_bsm(T/0.3), f=T<0.22?0:Math.min(1,Math.pow((T-0.22)/0.55,1.7)), settle=T>0.77?Math.sin(Math.min(1,(T-0.77)/0.25)*Math.PI)*0.06:0;

  const kb=buckle*(1-f), hipH=BODY.pelvis-0.04-0.32*kb;
  rig.pelvis.position.set(0,hipH+0.04,0); rig.spine.position.set(0,hipH+0.04,0); rig.pelvis.rotation.y=0;
  bodyLeg(rig.ll,-0.02,-hipH,-0.08*kb); bodyLeg(rig.rl,0.03,-hipH,0.05*kb);
  rig.spine.rotation.set((s.fallDir>0?0.12:-0.35)*buckle,0,s.fallRoll*buckle);
  rig.aim.rotation.set(-0.7*buckle-0.8*f,0,0.3*buckle);   // the gun drops, and the arms end up along the body rig.head.rotation.set(-0.35*buckle,0,0.2*buckle);
  rig.la.rotation.z=0.3*buckle;

}
function bodySnapDead(rig,dir){ if(!rig) return; rig.s.dying=0; rig.s.fallDir=dir||1; rig.s.fallRoll=0; rig.s.c0=0; bodyFall(rig,5); }

/* ---- enemies ---- */
// how high an enemy's eyes and gun are: lower when crouched, so what it can see and shoot matches what you can see of it
const eEye=e=>1.6-0.46*(e.crouchA||0), eGunY=e=>1.4-0.43*(e.crouchA||0);
// crouch behind cover while reloading, holding an angle out of sight, or waiting in cover; stand to move
function eWantsCrouch(e){ if(e.k.boss||e.state!=='combat') return false; if(e.susp&&e.susp.phase==='check') return true; if(e.rig&&e.rig.s.v>0.5) return false;
  return e.reloadT>0||e.mode==='cover'||(e.mode==='hold'&&!e.sees); }
function enemyPose(e,dt){
  const rig=e.rig; if(!rig) return; const s=rig.s;
  // far away (in the fog) the pose only needs updating ten times a second
  const cx=camera.position.x-e.pos.x, cz=camera.position.z-e.pos.z;
  if(cx*cx+cz*cz>110*110){ s.skip+=dt; if(s.skip<0.1) return; dt=s.skip; } s.skip=0;
  const host=!NET.on||NET.host, np=e.np;
  let aim=null, crouch, alert, rl=-1;
  if(host){
    const t=e.sees&&R.tgts?R.tgts.find(x=>x.id===e.tgtId):null; const sc=e.k.boss?1.45:1;
    if(t){ const d=Math.hypot(t.x-e.pos.x,t.z-e.pos.z)||1; aim=Math.atan2(t.eye-0.35-(e.pos.y+eGunY(e)*sc),d); }
    crouch=eWantsCrouch(e); alert=e.state==='combat';
    if(e.reloadT>0){ const tot=e.reloadTot||ITEMS[e.gun.id].reload+0.4; rl=clamp(1-e.reloadT/tot,0,1); }
  } else { // online, not the host: the host sends the pose bits
    const b=np?np.b:0; crouch=!!(b&1); alert=!!(b&4); aim=b&8?np.aim:null;
    if(b&2){ if(e.rlT0==null) e.rlT0=R.t; rl=clamp((R.t-e.rlT0)/(ITEMS[e.gun.id].reload+0.4),0,1); } else e.rlT0=null;
    if(b&16&&!e.k16) bodyKick(rig); e.k16=!!(b&16);

// what the host tells everyone else about an enemy's pose
function enemyPoseBits(e){ return (eWantsCrouch(e)?1:0)|(e.reloadT>0?2:0)|(e.state==='combat'?4:0)|(e.sees?8:0)|(e.shotT&&R.t-e.shotT<0.12?16:0); }
// kept for old callers (the debug panel's freeze, workshop scenes): pose an enemy standing where it is
function walkAnim(e,dt){ if(e.rig) enemyPose(e,dt); }
function animDead(e,dt){ if(!e.rig) return; if(e.rig.s.dying<0) bodyDie(e.rig,e.killFrom?e.killFrom.x:null,e.killFrom?e.killFrom.z:null); bodyAnim(e.rig,{},dt);
  e.g.position.y=(R&&R.terrain?R.terrain(e.pos.x,e.pos.z):0)+e.rig.s.fallY*(e.k&&e.k.boss?1.45:1); }

/* ---- other players ---- */
function remotePose(p,dt){ if(!p.rig) return; const st=p.st;
  bodyAnim(p.rig,{yaw:p.g.rotation.y,crouch:!!st.crouch,aim:clamp(st.p||0,-0.75,0.75),alert:true,sit:!!st.rd,down:!!st.down},dt); }

/* 59-drones: recon drones flown by a fly's brain
   The controller is a small rate-coded network laid out like the circuits mapped in the fruit fly connectome
   (FlyWire): what each part does is the fly's, the numbers are ours.
   - Eye: 16 columns of ommatidia around the drone, each reporting a small moving target in its 22.5° of azimuth
     (a person: stronger when they move, weaker crouched, nothing through walls or roofs, nothing past the fog).
   - Lobula (small-target motion detectors): lateral inhibition between columns sharpens that into one bearing.
   - Central complex compass (EPG ring attractor): 16 neurons with local excitation and global inhibition hold a bump
     of activity at the drone's heading; turning shifts the bump (angular velocity input) and a visual landmark
     input keeps it from drifting. The drone steers by this internal compass, not by the true heading.
   - Goal (fan-shaped body): a second bump at the heading it wants: toward the target, toward a report, along a
     casting zigzag, or a Lévy-flight search heading.
   - Steering (PFL3): two populations compare the goal with the compass bump shifted ±45°; their difference is the
     turn command, which is how flies turn toward a goal heading.
   - Looming (giant fibre): someone aiming at it from close, or shots going past, builds a looming signal; past a
     threshold it makes an escape saccade, darting sideways and up.
   - Mushroom body: it remembers where it has found people (a slowly fading value map) and how recently it has
     searched each patch, and leans its search flights toward likely, unvisited places.
   Behaviour, like a fly tracking an odour plume: explore (Lévy flight) → surge toward a cue or a radio report →
   track (hold off about 26 m and circle, reporting on the radio every second) → cast (zigzag wider and wider where
   it lost you) → back to exploring. On a low battery it flies home, lands and recharges.
   Drones never shoot. They see and they tell: a report goes to the ground groups nearby (57-ai.js), which send at
   most a couple of people. You can hear them (a buzz), see their lights, and shoot them down (they drop parts). A
   radio jammer in your gear cuts their link within 40 m: they lose you and drift. */
const DRONE={hp:45, alt:15, cruise:7, surge:11, sight:62, standoff:26, report:1.0, battery:[240,360], recharge:35, leash:240,
  count:{kolvik:1,whiteout:1,skarsvik:2,storvidda:2,kaldfjord:5}};
const FLY={n:16, tau:0.08, exc:2, inh:0.3, land:0.12, pflShift:2, turnGain:3.2, loomTh:1, levy:1.6};
const _th=i=>i/FLY.n*Math.PI*2;                            // preferred direction of column / ring neuron i
const _wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function flyBrain(yaw){ const b={eye:new Float32Array(FLY.n),stmd:new Float32Array(FLY.n),epg:new Float32Array(FLY.n),goal:new Float32Array(FLY.n),pflL:0,pflR:0,loom:0,
  mode:'explore',modeT:0,flightT:0,goalAng:yaw,castSide:1,castT:0,castN:0,last:null,lastT:-99,mb:new Map(),seen:new Map(),escT:0};
  for(let i=0;i<FLY.n;i++) b.epg[i]=Math.max(0,Math.cos(_th(i)-yaw)); return b; }
// population vector of a ring: the angle it encodes
function ringAngle(r){ let x=0,y=0; for(let i=0;i<FLY.n;i++){ x+=r[i]*Math.cos(_th(i)); y+=r[i]*Math.sin(_th(i)); } return Math.atan2(y,x); }

/* ---- the drones themselves ---- */
function droneMesh(d){
  const g=new THREE.Group(), dark=MC(0x24282c), grey=MC(0x50565c); const ud={drone:d,part:'drone'};
  const box=(w,h,dd,x,y,z,m)=>{ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,dd),m); o.position.set(x,y,z); o.userData=ud; g.add(o); return o; };
  box(0.42,0.14,0.42,0,0,0,dark); box(0.18,0.1,0.22,0,0.11,0.02,grey);
  const rot=[]; for(const [sx,sz] of [[1,1],[1,-1],[-1,1],[-1,-1]]){ const arm=box(0.06,0.05,0.5,sx*0.2,0,sz*0.2,dark); arm.rotation.y=sx*sz>0?-Math.PI/4:Math.PI/4;
    const r=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.01,0.05),MC(0x111316)); r.position.set(sx*0.36,0.08,sz*0.36); g.add(r); rot.push(r); }
  const cam=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,4),MC(0x101214)); cam.position.set(0,-0.1,-0.14); g.add(cam);
  const lr=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.06,0.1),MB(0xff3a2a)); lr.position.set(-0.36,0.0,-0.36); g.add(lr);
  const lg=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.06,0.1),MB(0x3cf07a)); lg.position.set(0.36,0.0,-0.36); g.add(lg);
  const lw=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.07,0.09),MB(0xffffff)); lw.position.set(0,0.0,0.24); g.add(lw);
  g.scale.setScalar(1.8); // a big recon quad, about 1.4 m across the rotors
  g.rotation.order='YXZ'; scene.add(g); g.traverse(o=>o.layers.enable(1)); d.parts=g.children.filter(o=>o.userData===ud); R.targets.push(...d.parts); d.rot=rot; d.blink=lw; return g;
}
function spawnDrones(mapId){
  R.drones=[]; let n=DRONE.count[mapId]||0; if(!n||!R.enemies.length) return; n=Math.max(1,Math.round(n*({easy:0.6,normal:1,hard:1.25,brutal:1.5}[R.diff]||1)));
  // bases: where the groups with radios are
  const A=aiState(); const bases=A.groups.filter(g=>R.enemies.some(e=>e.grp===g.id&&HAS_RADIO.has(e.kind)));
  const pool=bases.length?bases:A.groups; if(!pool.length) return;
  for(let i=0;i<n;i++){ const g=pool[(i*7+3)%pool.length]; const x=g.x+rr(-6,6), z=g.z+rr(-6,6); const yaw=rr(0,6.28);
    const d={i,x,z,y:(R.terrain?R.terrain(x,z):0)+0.4,vx:0,vz:0,vy:0,yaw,yawRate:0,hp:DRONE.hp,dead:false,home:{x,z},bat:rr(...DRONE.battery)*(0.5+Math.random()*0.5),gainErr:(Math.random()-0.5)*0.12,landed:i>0?rr(5,40):0,brain:flyBrain(yaw),repT:0,losT:0,seeing:null};
    d.g=droneMesh(d); d.g.position.set(d.x,d.y,d.z); R.drones.push(d); }
}
// a lookup of the mushroom-body maps, on a 20 m grid
const mbKey=(x,z)=>Math.floor(x/20)*100000+Math.floor(z/20);
function mbValue(b,x,z){ return b.mb.get(mbKey(x,z))||0; }
function mbNovel(b,x,z){ const t=b.seen.get(mbKey(x,z)); return t==null?1:1-Math.exp(-(R.t-t)/90); }

/* ---- one brain step ---- */
function flyThink(d,dt){
  const b=d.brain, N=FLY.n, sight=Math.min(DRONE.sight,scene.fog&&scene.fog.density?1.25/scene.fog.density:DRONE.sight)*(R.sight||1);
  const jam=jammed(d.x,d.z);
  // 1. eye: one small-target signal per column
  b.eye.fill(0); let best=null, bs=0;
  for(const t of R.tgts){ if(t.grace) continue; const dx=t.x-d.x, dz=t.z-d.z, dist=Math.hypot(dx,dz,t.eye-d.y); if(dist>sight) continue;
    d.vis=d.vis||{}; const vc=d.vis[t.id]; if(!vc||R.t>vc.t){ d.vis[t.id]={t:R.t+0.2,v:los(d.x,d.y-0.2,d.z,t.x,t.eye-0.4,t.z)}; }
    if(!d.vis[t.id].v) continue;
    const sal=(1.25-dist/sight)*(t.moving?1:0.45)*(t.crouch?0.75:1)*(t.sprint?1.2:1); if(sal<=0.05) continue;
    const rel=_wrap(Math.atan2(-dx,-dz)-d.yaw); for(let i=0;i<N;i++){ const dd=_wrap(rel-(_th(i)-Math.PI)); b.eye[i]+=sal*Math.exp(-dd*dd/0.08); }
    if(sal>bs){ bs=sal; best={t,dist}; } }
  // 2. lobula: lateral inhibition, then threshold
  let mean=0; for(let i=0;i<N;i++) mean+=b.eye[i]; mean/=N; let peak=0; for(let i=0;i<N;i++){ b.stmd[i]=Math.max(0,b.eye[i]-1.5*mean); peak=Math.max(peak,b.stmd[i]); }
  const target=peak>0.12&&best?best:null;
  // 3. compass: P-EN neurons push the bump round by how far the drone turned (each drone's sense of its own turning
  //    is a few percent off, so it drifts), the E-PG ring's local excitation and global inhibition hold it together,
  //    and the sky (weaker in a blizzard) pulls it back toward the true heading
  { const sh=d.yawRate*(1+d.gainErr)*dt/(2*Math.PI/N), sp=b.sp||(b.sp=new Float32Array(N)), ne=b.ne||(b.ne=new Float32Array(N));
    for(let i=0;i<N;i++){ const src=i-sh, i0=Math.floor(src), f=src-i0; sp[i]=b.epg[((i0%N)+N)%N]*(1-f)+b.epg[(((i0+1)%N)+N)%N]*f; }
    const land=FLY.land*(R.cond&&R.cond.weather==='blizzard'?0.3:1); let tot=0;
    for(let i=0;i<N;i++){ let s=0; for(let j=0;j<N;j++) s+=(FLY.exc*Math.cos(_th(i)-_th(j))-FLY.inh)*sp[j]; s+=land*Math.max(0,Math.cos(_th(i)-d.yaw)); ne[i]=Math.max(0,sp[i]+dt/FLY.tau*(-sp[i]+Math.max(0,s))); tot+=ne[i]; }
    for(let i=0;i<N;i++) b.epg[i]=tot>0?ne[i]/tot:1/N; }
  const compass=ringAngle(b.epg);
  // 4. behaviour: what the goal heading should be
  const setMode=m=>{ if(b.mode!==m){ b.mode=m; b.modeT=R.t; } };
  if(target&&!jam){ const t=target.t; b.last={x:t.x,z:t.z,tid:t.id}; b.lastT=R.t; b.mb.set(mbKey(t.x,t.z),mbValue(b,t.x,t.z)+dt*2); d.seeing=t.id; if(b.mode!=='escape'&&b.mode!=='return') setMode('track'); }
  else { d.seeing=null; if(b.mode==='track') { setMode('cast'); b.castN=0; b.castT=0; } }
  if(jam&&b.mode!=='return'){ d.seeing=null; if(b.mode!=='explore') setMode('explore'); }
  // hearing: a snowmobile engine carries a long way
  if(!target&&!jam&&(b.mode==='explore'||b.mode==='cast')&&R.t>(b.hearT||0)){ b.hearT=R.t+3; for(const t of R.tgts){ if(!t.ride) continue; const dd=Math.hypot(t.x-d.x,t.z-d.z); if(dd<250){ b.last={x:t.x+_gauss()*12,z:t.z+_gauss()*12,tid:t.id}; b.lastT=R.t; setMode('surge'); break; } } }
  // heard about someone on the radio: the freshest picture any ground group has
  if(!jam&&(b.mode==='explore'||b.mode==='cast')){ let fr=null; for(const k in aiState().bel){ const B=aiState().bel[k]; if(B.init&&B.est&&R.t-B.lastClue<6&&(!fr||B.lastClue>fr.lastClue)) fr=B; }
    // at most two drones go after one person; the rest keep searching elsewhere
    const busy=fr?R.drones.filter(o=>o!==d&&!o.dead&&(o.brain.mode==='track'||o.brain.mode==='surge')&&o.brain.last&&o.brain.last.tid===fr.tid).length:0;
    if(fr&&busy<2&&R.t-b.lastT>4){ b.last={x:fr.est.x,z:fr.est.z,tid:fr.tid}; b.lastT=fr.lastClue; setMode('surge'); } }
  d.bat-=dt; if(d.bat<=0&&b.mode!=='return'){ setMode('return'); }
  // looming: being aimed at closely, or shot at
  b.loom*=Math.exp(-dt*1.5); for(const t of R.tgts){ if(t.id!=='me'||!P) continue; const dx=d.x-P.pos.x, dy=d.y-(P.y+P.eye), dz=d.z-P.pos.z, L=Math.hypot(dx,dy,dz); if(L>45) continue; const fx=-Math.sin(P.yaw)*Math.cos(P.pitch), fy=Math.sin(P.pitch), fz=-Math.cos(P.yaw)*Math.cos(P.pitch); if((fx*dx+fy*dy+fz*dz)/L>0.997&&P.adsT>0.5) b.loom+=dt*1.4*(45/Math.max(8,L)); }
  if(b.loom>FLY.loomTh&&b.mode!=='escape'&&b.mode!=='return'){ b.escT=R.t+1.3; b.escSide=Math.random()<0.5?-1:1; b.prev=b.mode; setMode('escape'); b.loom=0; }
  let goal=b.goalAng, speed=DRONE.cruise, alt=DRONE.alt;
  switch(b.mode){
    case 'track': { const t=target.t; const dx=d.x-t.x, dz=d.z-t.z, L=Math.hypot(dx,dz)||1; const orbit=0.25; const ox=t.x+(dx/L*Math.cos(orbit)-dz/L*Math.sin(orbit))*DRONE.standoff, oz=t.z+(dz/L*Math.cos(orbit)+dx/L*Math.sin(orbit))*DRONE.standoff;
      const gd=Math.hypot(ox-d.x,oz-d.z); goal=gd>2?Math.atan2(-(ox-d.x),-(oz-d.z)):Math.atan2(-(t.x-d.x),-(t.z-d.z)); speed=clamp(gd*0.6,0,DRONE.surge); alt=13;
      // report what it sees
      if(R.t>d.repT){ d.repT=R.t+DRONE.report; aiRadio(null,t.id,t.x,t.z,{drone:true,fx:d.x,fz:d.z,key:'drone'+d.i,sig:3,delay:0.4,every:DRONE.report,send:2,kind:'drone'}); } break; }
    case 'surge': { const L=b.last; const gd=Math.hypot(L.x-d.x,L.z-d.z); goal=Math.atan2(-(L.x-d.x),-(L.z-d.z)); speed=DRONE.surge; if(gd<10){ setMode('cast'); b.castN=0; b.castT=0; } break; }
    case 'cast': { // zigzag across the last known spot, a bit wider each pass
      const L=b.last||{x:d.x,z:d.z}; b.castT-=dt; if(b.castT<=0){ b.castN++; b.castSide*=-1; b.castT=2+b.castN*0.8; }
      const base=Math.atan2(-(L.x-d.x),-(L.z-d.z)), far=Math.hypot(L.x-d.x,L.z-d.z); goal=base+b.castSide*(far<15+b.castN*6?1.25:0.55); speed=DRONE.cruise;
      if(R.t-b.modeT>28) setMode('explore'); break; }
    case 'escape': { goal=d.yaw+b.escSide*1.7; speed=DRONE.surge*1.2; alt=DRONE.alt+8; if(R.t>b.escT) setMode(b.prev==='track'?'cast':b.prev||'explore'); break; }
    case 'return': { const gd=Math.hypot(d.home.x-d.x,d.home.z-d.z); goal=Math.atan2(-(d.home.x-d.x),-(d.home.z-d.z)); speed=clamp(gd*0.5,1,DRONE.cruise); if(gd<3){ alt=0.4; if(d.y-(R.terrain?R.terrain(d.x,d.z):0)<0.8){ d.landed=DRONE.recharge; d.bat=rr(...DRONE.battery); setMode('explore'); } } break; }
    default: { // Lévy flight: short hops mostly, now and then a long one; each heading picked by the mushroom body
      b.flightT-=dt; const out=Math.max(Math.abs(d.x),Math.abs(d.z))>R.bound-30||Math.hypot(d.x-d.home.x,d.z-d.home.z)>DRONE.leash*(R.bound>500?1.8:1);
      if(b.flightT<=0||out){ b.flightT=Math.min(30,3*Math.pow(1-Math.random(),-1/FLY.levy));
        let bestA=0, bv=-1e9; for(let k=0;k<8;k++){ const a=out?Math.atan2(-(d.home.x-d.x),-(d.home.z-d.z))+(Math.random()-0.5):Math.random()*6.2832; let v=0;
          for(const r of [40,80,130]){ const px=d.x-Math.sin(a)*r, pz=d.z-Math.cos(a)*r; if(Math.abs(px)>R.bound-20||Math.abs(pz)>R.bound-20){ v-=3; continue; } v+=mbValue(b,px,pz)*0.6+mbNovel(b,px,pz); }
          v+=Math.random()*0.6; if(v>bv){ bv=v; bestA=a; } } b.goalAng=bestA; }
      goal=b.goalAng; speed=DRONE.cruise; }
  }
  b.seen.set(mbKey(d.x,d.z),R.t); for(const [k,v] of b.mb) if(v>0.01) b.mb.set(k,v*Math.exp(-dt*0.004));

/* ---- how you move ----
   Weight without lag: speed builds and drops at set rates (a sprint takes a moment to wind up, stopping is quicker
   than starting), you can't steer much in the air, and a hard landing dips the camera and slows you for a moment.
   The head bob follows your actual footsteps: a dip as each foot lands (that's when the step sounds), a sway toward
   the standing foot, a slight roll, all bigger when sprinting and smaller crouched or aiming. Strafing leans the
   camera a touch, sudden stops nod it, and when you're out of breath your aim rises and falls with your breathing. */
const PMOVE={
  acc:13, sprintAcc:6.5, stop:18, turn:22, air:2.5, para:4,   // m/s² starting, sprinting up from a walk, stopping, reversing, in the air, under a parachute
  step:{walk:1.25, sprint:1.7, crouch:0.8, sneak:0.75},       // metres per step
  bob:{walk:0.032, sprint:0.05, crouch:0.018, sneak:0.012},   // camera dip per step (m)
  sway:{walk:0.016, sprint:0.028}, roll:{walk:0.005, sprint:0.009},
  lean:0.02, nod:0.0016, land:{dip:0.03, slowAt:7.5},        // strafe lean (rad), nod per m/s², landing dip per m/s of fall, slowed above this fall speed
  sprintFov:4, breath:{at:45, amp:0.006},                     // FOV widening at a full sprint; breathing sway below this stamina

function pmCam(){ return {y:0,vy:0,p:0,vp:0,roll:0,lat:0,fw:0,acc:0,br:0,brT:0}; }

function openInv(target){
  if(P.dead||P.down) return;
  if(target&&target.locked&&!R.bossDown){ toast('Sealed. It opens when Jarl Hrafn is dead.'); return; }
  R.invOpen=true; R.lootTarget=target||null; SEL=null; P.trigger=false; P.adsHeld=false; P.keys={};
  if(target&&!target.opened){ target.opened=true; R.revealT=0.6; sfxOpen(); qBump(o=>o.type==='loot'&&(!o.cont||o.cont===target.type)?1:0); goalBump('searched'); }
  if(document.pointerLockElement) document.exitPointerLock();
  $('#rinv').hidden=false; renderRaidInv();
}
function closeInv(silent){ if(!R) return; R.invOpen=false; R.lootTarget=null; cancelDrag(); $('#rinv').hidden=true; SEL=null; if(!silent&&!R.noLock&&!R.over) lockPointer(); }
function renderRaidInv(){
  GRIDS={}; const el=$('#rinv'); const t=R.lootTarget; const hidden=t?t.cont.items.filter(i=>i.hid).length:0;

function revealTick(dt){ const t=R.lootTarget; if(!t) return; const next=t.cont.items.filter(i=>i.hid).sort((a,b)=>a.y-b.y||a.x-b.x)[0]; if(!next) return; R.revealT-=dt; if(R.revealT<=0){ delete next.hid; R.revealT=0.35+ITEMS[next.id].rar*0.18; if(drag) R.dirty=true; else renderRaidInv(); } }

/* ---- end raid ---- */
function endRaid(kind,detail){
  if(!R||R.over) return; R.over=true; if(document.pointerLockElement) document.exitPointerLock();
  try{ gaRaidEnd(kind); }catch(err){ console.warn('adaptive AI',err); } // score the enemies' behaviour genes (57-ai.js)
  if(NET.on){ if(kind==='extract') nsend({t:'msg',text:`${S.name||'Nomad'} extracted through ${detail}`}); netLeave(); }
  const kills=R.kills, time=R.t, mapName=MAPS[R.map].name, startV=R.startValue;
  for(const s of [...SLOTS,'pockets','pouch']){ const it=S.eq[s]; if(it&&it.items) for(const x of it.items) delete x.hid; }
  S.stats.raids++; S.stats.kills+=kills; S.career.raids++; S.career.kills+=kills; if(kind==='extract') S.career.extracts++;
  let deposited=0;
  const collectCash=()=>{ for(const s of ['pockets','rig','pack','pouch']){ const it=S.eq[s]; if(!it) continue; it.items=it.items.filter(x=>{ if(x.id==='cash'){ deposited+=x.n; return false; } return true; }); } };
  let value=0, cacheIn=0, cacheBonus=[]; ensureCos();
  if(kind==='extract'){ S.stats.extracts++; value=carriedValue(); collectCash();
    for(const s of ['pockets','rig','pack','pouch']){ const it=S.eq[s]; if(!it) continue; it.items=it.items.filter(x=>{ if(x.id==='cache'){ cacheIn++; return false; } return true; }); }
    if(S.cos.dayEx!==dayKey()){ S.cos.dayEx=dayKey(); cacheBonus.push('first extraction today'); }
    if(S.career.extracts%10===0) cacheBonus.push(`extraction #${S.career.extracts}`);
    S.cos.caches+=cacheIn+cacheBonus.length; }
  const bossRw=kind==='extract'?R.bossReward:null; if(bossRw){ S.cash+=bossRw.cash; S.cos.caches+=bossRw.caches; }
  if(kind!=='extract'){ if(kind==='kia') S.stats.deaths++; SLOTS.forEach(k=>S.eq[k]=null); S.eq.pockets.items=[]; collectCash(); }

  try{ ws=new WebSocket(`${proto}://${location.host}/ws`); }catch(e){ return netRetry(); }

addEventListener('beforeunload',()=>{ if(ACC.token&&ACC.pending&&navigator.sendBeacon){ /* best effort */ } });
function accBtn(){ const b=$('#accBtn'); b.hidden=!NET.avail; b.textContent=ACC.name?`◉ ${ACC.name}`:'Sign in'; }
async function accLoad(){ if(!ACC.token||!NET.avail) return; try{ const j=await accFetch('api/load','GET'); if(j.save&&j.save.v===2){ S=j.save; S.inRaid=false; S.stash.h=STASH_ROWS[S.hide.stash]; normSave(); applySeason(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(!R) renderTab(); } }catch(e){ if(/signed/.test(e.message)){ ACC.token=null; ACC.name=null; accStore(); } } accBtn(); }
function accModal(){
  const m=$('#accModal'); m.hidden=false;
  if(ACC.name){ m.innerHTML=`<div class="card acc"><span class="lbl">Account</span><h2>${esc(ACC.name)}</h2><p class="muted" style="margin:0">Your stash, cash, hideout and stats are saved on this server after every change. Sign in on any device to pick up where you left off.</p><div class="acts"><button class="btn ghost" id="accOut">Sign out</button><button class="btn" id="accClose">Close</button></div></div>`;
    $('#accOut').onclick=async()=>{ await accFlush(); try{ await accFetch('api/logout','POST'); }catch(e){} ACC.token=null; ACC.name=null; accStore(); accBtn(); m.hidden=true; NET.friends=[]; NET.fin=[]; NET.fout=[]; NET.dms=new Map(); NET.dmWith=null; NET.invites=[]; renderInvites(); socialBadge(); netHello(); renderTab(); toast('Signed out. This browser keeps a local copy.'); };
    $('#accClose').onclick=()=>m.hidden=true; return; }
  m.innerHTML=`<div class="card acc"><span class="lbl">Account</span><h2>Sign in</h2><p class="muted" style="margin:0">New name registers an account and keeps the progress in this browser. Existing name signs in and loads your server save.</p>
    <label class="lbl" for="accName">Name</label><input id="accName" maxlength="16" autocomplete="username" placeholder="3–16 letters, numbers, _">
    <label class="lbl" for="accPass">Password</label><input id="accPass" type="password" maxlength="64" autocomplete="current-password" placeholder="at least 6 characters">
    <div class="err" id="accErr"></div><div class="acts"><button class="btn" id="accIn">Sign in</button><button class="btn ghost" id="accReg">Register</button><button class="btn ghost" id="accClose">Cancel</button></div></div>`;
  const go=async(reg)=>{ const name=$('#accName').value.trim(), pass=$('#accPass').value; $('#accErr').textContent='';
    try{ const j=await accFetch(reg?'api/register':'api/login','POST',reg?{name,pass,save:S}:{name,pass}); ACC.token=j.token; ACC.name=j.name; accStore(); NET.dms=new Map(); NET.dmWith=null; netHello(); if(!reg){ if(j.save&&j.save.v===2){ S=j.save; S.inRaid=false; S.stash.h=STASH_ROWS[S.hide.stash]; normSave(); applySeason(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} } else accPush(S); } m.hidden=true; accBtn(); if(!S.name) S.name=j.name.slice(0,14); renderTab(); toast(reg?`Account ${j.name} created.`:`Signed in as ${j.name}.`); }
    catch(e){ $('#accErr').textContent=e.message; } };
  $('#accIn').onclick=()=>go(false); $('#accReg').onclick=()=>go(true); $('#accClose').onclick=()=>m.hidden=true;
  $('#accPass').onkeydown=e=>{ if(e.key==='Enter') go(false); };
}

/* 99-boot: boot */
/* ---- boot ---- */
// the workshop (/workshop) loads this page's code as a preview without starting the game: no save, hideout or network
if(window.KOLVIK_WORKSHOP){ S=newSave(); normSave(); }
else {
S=loadGame();
let abandoned=false;
if(!S){ S=newSave(); saveGame(); } else if(S.inRaid){ S.inRaid=false; abandoned=true; saveGame(); }
// older saves: weapons without attachment slots
(function(){ const fix=it=>{ if(!it) return; if(ITEMS[it.id]&&ITEMS[it.id].type==='weapon'&&!it.att) it.att={optic:null,muzzle:null,mag:null}; if(it.items) it.items.forEach(fix); }; S.stash.items.forEach(fix); Object.values(S.eq).forEach(fix); })();
S.stash.h=STASH_ROWS[S.hide.stash];
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#musicBtn').onclick=()=>{ if(MUS.on){ musicStop(); S.music=false; } else { S.music=true; musicStart(); } saveGame(); };
$('#nextBtn').onclick=()=>musicNext();
// browsers only allow sound after a click, so start the menu theme on the first interaction
// on click, not pointerdown: starting the music changes the header, and doing that between press and release made the first click on the page miss its button
document.addEventListener('click',function first(){ document.removeEventListener('click',first,true); setTimeout(()=>{ if(S.music&&!R&&!MUS.on) musicStart(); },0); },true);
if(!S.name) S.name=''; if(!S.lastKit) S.lastKit=[]; normSave(); buildHUD(); $('#scope').innerHTML=scopeSvg(); setTab('gear'); $('#accBtn').onclick=accModal; $('#optBtn').onclick=openOpts; $('#dbgBtn').onclick=openDebug;
$('#rchatForm').onsubmit=e=>{ e.preventDefault(); const t=$('#rchatIn').value.trim(); let mm;
  if(t){ if((mm=t.match(/^@(\w{3,16})\s+(.+)/))) wsend({t:'dm',to:mm[1].toLowerCase(),text:mm[2]});
    else if((mm=t.match(/^\/r\s+(.+)/))){ if(NET.lastDM) wsend({t:'dm',to:NET.lastDM,text:mm[1]}); else raidNote('Nobody has messaged you yet.'); }
    else if(R.chatCh==='dm'){ if(NET.lastDM) wsend({t:'dm',to:NET.lastDM,text:t}); else raidNote('Start with @name to message a friend.'); }
    else wsend({t:'chat',ch:R.chatCh,text:t}); }
  closeRaidChat(); };
$('#rchatIn').addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); closeRaidChat(); } else if(e.key==='Tab'){ e.preventDefault(); const c=raidChans(); setRaidCh(c[(c.indexOf(R.chatCh)+1)%c.length]); } });
$('#rchatIn').addEventListener('blur',()=>{ if(R&&R.chatOpen) setTimeout(()=>{ if(R&&R.chatOpen&&document.activeElement!==$('#rchatIn')) closeRaidChat(); },0); }); netProbe().then(()=>{ accBtn(); return accLoad(); });
if(abandoned) toast('You left your last raid early. That gear is gone.');
}
</script>
