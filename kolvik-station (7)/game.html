<title>Kolvik Station</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: station console — header strip with readouts, tab rail, gear grids; raid is a full-screen low-res canvas with HUD in the corners */
:root{
  --ice:#0b1215; --panel:#121c21; --panel2:#18252b; --line:#26363e; --frost:#dfe9ec; --dim:#7f949b;
  --signal:#ff6b1a; --signal-ink:#1a0b02; --ok:#7cc9a4; --warn:#e8c55a; --bad:#e2574a; --cash:#9fd27a;
  --r0:#25323a; --r1:#21433a; --r2:#24395c; --r3:#4a2c5a; --r4:#5e4518;
  --display:'Big Shoulders Stencil Display', Impact, 'Arial Narrow', sans-serif;
  --body:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --cell:46px;
  color-scheme: dark;
}
@media (max-width:640px){ :root{ --cell:34px } }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ice); color:var(--frost); font-family:var(--body); font-size:15px; line-height:1.4; overflow-x:hidden}
body.inraid{overflow:hidden}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px}
h1,h2,h3{text-wrap:balance; margin:0}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- hub ---------- */
#hub{min-height:100%; display:flex; flex-direction:column}
.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; padding-block:18px 14px; background:var(--panel); border-bottom:1px solid var(--line)}
.brand{display:flex; flex-direction:column; gap:4px}
.mark{font-family:var(--display); font-weight:800; font-size:46px; line-height:.85; letter-spacing:.03em}
.mark em{font-style:normal; color:var(--signal)}
.read{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
.topr{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.bal{display:flex; flex-direction:column; align-items:flex-end}
.bal b{font-family:var(--mono); font-weight:600; font-size:26px; color:var(--cash); font-variant-numeric:tabular-nums}
.musicbtn{background:transparent; border:1px solid var(--line); padding:6px 10px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); cursor:pointer}
.musicbtn[aria-pressed="true"]{color:var(--frost); border-color:var(--signal)}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); overflow-x:auto; background:var(--panel)}
.tabs button{background:none; border:none; border-bottom:3px solid transparent; padding:10px 14px 8px; font-family:var(--display); font-weight:600; font-size:21px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); cursor:pointer; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--frost); border-color:var(--signal)}
main#tabbody{flex:1; padding-block:20px 48px}
.h2{font-family:var(--display); font-weight:800; font-size:28px; letter-spacing:.04em; text-transform:uppercase}
.lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.btn{background:var(--signal); color:var(--signal-ink); border:none; padding:9px 16px; font-family:var(--display); font-weight:800; font-size:18px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer}
.btn:disabled{background:#3a2a20; color:#7b6252; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--frost); border:1px solid var(--line)}
.btn.sm{font-size:14px; padding:6px 10px}
.muted{color:var(--dim)}
.cash{color:var(--cash); font-family:var(--mono); font-variant-numeric:tabular-nums}

/* gear */
.gear{display:grid; grid-template-columns:minmax(0,auto) minmax(0,auto) minmax(220px,1fr); gap:24px; align-items:start}
@media (max-width:1180px){ .gear{grid-template-columns:minmax(0,auto) minmax(0,1fr)} .gear .info{grid-column:1 / -1} }
@media (max-width:760px){ .gear{grid-template-columns:minmax(0,1fr)} }
.col{display:flex; flex-direction:column; gap:12px; min-width:0}
.colhead{display:flex; align-items:center; justify-content:space-between; gap:12px}
.slots{display:grid; grid-template-columns:repeat(2, calc(var(--cell)*3.2)); gap:8px}
.slot{background:var(--panel); border:1px solid var(--line); height:calc(var(--cell)*1.9); position:relative; padding:18px 5px 5px; box-sizing:border-box}
.slot.wide{grid-column:span 2; width:auto}
.slot .slab{position:absolute; top:4px; left:6px; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.slot.dropok{outline:2px solid var(--ok); outline-offset:-2px}
.slot .item.inslot{position:relative; left:auto; top:auto; width:100%; height:100%}
.gblock{display:flex; flex-direction:column; gap:6px}
.gridbox{overflow:auto; max-width:100%}
.stashbox{max-height:72vh}
.grid{position:relative; width:calc(var(--gw)*var(--cell)); height:calc(var(--gh)*var(--cell)); background-color:#0d161a; background-image:linear-gradient(to right, #1e2c33 1px, transparent 1px), linear-gradient(to bottom, #1e2c33 1px, transparent 1px); background-size:var(--cell) var(--cell); border:1px solid var(--line)}
.item{position:absolute; box-sizing:border-box; left:calc(var(--x)*var(--cell) + 1px); top:calc(var(--y)*var(--cell) + 1px); width:calc(var(--w)*var(--cell) - 1px); height:calc(var(--h)*var(--cell) - 1px); background:var(--r0); border:1px solid rgba(220,235,240,.13); font-family:var(--mono); font-size:10px; line-height:1.15; padding:3px 4px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden; color:var(--frost)}
@media (max-width:640px){ .item{font-size:8.5px} }
.item .nm{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .bd{position:absolute; right:3px; bottom:2px; font-variant-numeric:tabular-nums}
.item .ic{position:absolute; left:2px; right:2px; top:12px; bottom:2px; background:center/contain no-repeat; image-rendering:pixelated; opacity:.95; pointer-events:none}
.item .nm{position:relative; z-index:1} .item .bd{z-index:1}
.atts{display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--line); padding-top:8px}
.attrow{display:grid; grid-template-columns:52px 1fr auto; gap:8px; align-items:center; font-size:13px}
.online{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:900px){ .online{grid-template-columns:minmax(0,1fr)} }
.lobbies,.members{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.lobbies li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 10px; background:var(--panel); border-left:3px solid var(--signal)}
.lobbies li.raid{border-left-color:var(--line)}
.lobbies .ln{min-width:0} .lobbies .ln b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .lobbies .ln small{display:block; color:var(--dim); font-size:12.5px}
.members li{display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 10px; background:var(--panel)}
.members .pip{width:8px; height:8px; background:var(--line)} .members li.rdy .pip{background:var(--ok)}
.members .mn{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600}
.members .st{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim)} .members li.rdy .st{color:var(--ok)}
.tag{font-family:var(--mono); font-size:9.5px; font-weight:400; letter-spacing:.12em; text-transform:uppercase; padding:1px 5px; background:var(--panel2); color:var(--dim); vertical-align:2px}
.lobbymap{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
select{background:var(--panel); border:1px solid var(--line); color:var(--frost); font:inherit; padding:5px 8px}
.chatbox{background:var(--panel); border:1px solid var(--line); padding:14px}
.chatlog{height:250px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; font-size:14px; padding-right:4px}
.cm{color:#c6d3d7; overflow-wrap:anywhere} .cm time{font-family:var(--mono); font-size:10.5px; color:var(--dim)} .cm b{color:var(--frost)} .cm.lobby b{color:var(--signal)} .cm.sys{color:var(--warn); font-size:13px}
.chatform{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px}
.chatform input{background:var(--ice); border:1px solid var(--line); color:var(--frost); font:inherit; padding:6px 8px; min-width:0}
.badge{display:inline-block; margin-left:6px; min-width:18px; padding:0 5px; background:var(--signal); color:var(--signal-ink); font-family:var(--mono); font-size:11px; line-height:18px; text-align:center; vertical-align:3px}
#rchat{position:absolute; left:calc(16px + env(safe-area-inset-left,0px)); bottom:calc(160px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:2px; font-size:13px; max-width:min(460px,60vw)}
#rchat b{color:var(--warn)} #rchat .me b{color:var(--ok)}
#rchatForm{position:absolute; left:calc(16px + env(safe-area-inset-left,0px)); bottom:calc(132px + env(safe-area-inset-bottom,0px)); pointer-events:auto; width:min(460px,60vw)}
#rchatForm input{width:100%; box-sizing:border-box; background:rgba(5,9,11,.88); border:1px solid var(--signal); color:var(--frost); font:13px var(--mono); padding:6px 8px}
.friends{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:24px; align-items:start}
@media (max-width:900px){ .friends{grid-template-columns:minmax(0,1fr)} }
.frl{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.frl li{display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 10px; background:var(--panel); border-left:3px solid transparent}
.frl li.sel{border-left-color:var(--signal); background:var(--panel2)}
.frl .fn{min-width:0; background:none; border:none; padding:0; text-align:left; cursor:pointer; color:var(--frost); font:inherit}
.frl .fn b{font-weight:600} .frl .fn small{display:block; color:var(--dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.frl .acts{gap:6px; flex-wrap:nowrap}
.dot{width:8px; height:8px; background:var(--line)} .dot.on{background:var(--ok)} .dot.raid{background:var(--signal)} .dot.lobby{background:var(--warn)}
.fsec{display:flex; flex-direction:column; gap:8px}
.fsec h3{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:400; margin:6px 0 0}
.dmbox{background:var(--panel); border:1px solid var(--line); padding:14px; position:sticky; top:12px}
.dmlog{height:min(56vh,460px)}
.cm b.me{color:var(--ok)}
.tag.sq{background:#1f3a2e; color:var(--ok)}
.invites{position:fixed; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:90; display:flex; flex-direction:column; gap:8px; width:min(340px, calc(100% - 32px))}
.invite{background:var(--panel2); border:1px solid var(--signal); padding:12px 14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,.5)}
.invite p{margin:0}
#rchatForm{display:flex; align-items:stretch}
#rchatCh{font:600 11px var(--mono); letter-spacing:.1em; padding:0 8px; display:grid; place-items:center; background:var(--signal); color:var(--signal-ink); text-shadow:none}
#rchatCh.squad{background:var(--ok)} #rchatCh.dm{background:#9b7be0}
#rchat .k{font:600 10px var(--mono); letter-spacing:.1em; padding:0 4px; text-shadow:none; color:#06100b; background:var(--ok)} #rchat .k.dm{background:#9b7be0}
#rchat .squad b{color:var(--ok)} #rchat .dm b{color:#c4b0f5} #rchat .sy{color:var(--warn); font-style:italic}
#exlist .mate{color:var(--ok)}
.boardwrap{overflow-x:auto; max-width:100%}
table.board{border-collapse:collapse; min-width:760px; width:100%; font-variant-numeric:tabular-nums}
.board th,.board td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
.board th.nm,.board td.nm,.board .rk{text-align:left}
.board th{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:400}
.board th button{background:none; border:none; color:inherit; font:inherit; letter-spacing:inherit; text-transform:inherit; cursor:pointer; padding:0}
.board th button[aria-pressed="true"]{color:var(--frost)}
.board td{font-family:var(--mono); font-size:13px; color:#b9c6ca} .board td.on{color:var(--frost)}
.board td.nm{font-family:var(--body); font-weight:600; font-size:15px; color:var(--frost)}
.board tbody tr:nth-child(-n+3) td.rk{color:var(--warn); font-weight:600}
.board tr.me td{background:rgba(255,107,26,.12)} .board tr.me td.nm{color:var(--signal)}
.tlist{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; min-width:min(100%,320px)}
.trk{background:var(--ice); border:1px solid var(--line); color:var(--frost); padding:7px 10px; text-align:left; cursor:pointer; font:600 14px var(--body); display:flex; justify-content:space-between; gap:8px}
.trk small{font:400 11px var(--mono); color:var(--dim)} .trk[aria-pressed="true"]{border-color:var(--signal); background:rgba(255,107,26,.12)}
.opts .optrow.tracks{align-items:start}
.seg{display:inline-flex; border:1px solid var(--line)}
.seg button{background:none; border:none; padding:6px 12px; font:600 13px var(--body); color:var(--dim); cursor:pointer}
.seg button[aria-checked="true"]{background:var(--signal); color:var(--signal-ink)}
.opts .optrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; padding-block:10px; border-top:1px solid var(--line)}
.opts .optrow small{display:block; color:var(--dim); font-size:13px}
.opts input[type=range]{width:180px; accent-color:var(--signal)}
@media (max-width:520px){ .opts .optrow{grid-template-columns:minmax(0,1fr)} }
#optModal{position:fixed; z-index:95}
.haulbox{display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:12px}
.haul{display:flex; flex-wrap:wrap; gap:4px}
.hchip{display:inline-flex; align-items:center; gap:5px; font:600 10.5px var(--mono); padding:3px 7px 3px 3px; background:var(--r0)}
.hchip.r1{background:var(--r1)} .hchip.r2{background:var(--r2)} .hchip.r3{background:var(--r3)} .hchip.r4{background:var(--r4)}
.hchip .hic{width:18px; height:18px; background:center/contain no-repeat; image-rendering:pixelated}
.condline{display:flex; flex-wrap:wrap; gap:6px; font-family:var(--mono); font-size:11px; letter-spacing:.06em}
.condline span{padding:2px 7px; background:var(--panel2); color:var(--frost)}
.condline .wx-blizzard{background:#2d4a63} .condline .wx-aurora{background:#3b2d5a} .condline .wx-clear{background:#3a4a2a} .condline .md{background:#4a3416; color:#ffd9a8}
#exlist .evt{color:var(--warn)} #exlist .evt.ok{color:var(--ok)}
.tsec{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:400; margin:18px 0 8px}
.tasks{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%,330px),1fr)); gap:12px}
.task{background:var(--panel); border:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:8px}
.task.ready{border-color:var(--ok)} .task.donec{opacity:.55}
.task h3{font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:.03em; line-height:1}
.task p{margin:0}
.task .tg{display:flex; gap:6px; flex-wrap:wrap} .tag.ok{background:#1f3a2e; color:var(--ok)}
.objs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:14px}
.objs li{display:grid; grid-template-columns:16px minmax(0,1fr) auto auto; gap:8px; align-items:center}
.objs .ck{width:14px; height:14px; border:1px solid var(--line); display:grid; place-items:center; font-size:11px; color:var(--ok)}
.objs li.done .ol{color:var(--dim); text-decoration:line-through}
.objs .pg{font-family:var(--mono); font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}
.rw{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.qdone summary{cursor:pointer; color:var(--dim); font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin-top:18px}
.qdone ul{margin:8px 0 0; padding-left:18px}
#taskHud{position:absolute; left:calc(16px + env(safe-area-inset-left,0px)); top:calc(130px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:2px; font-size:11.5px; max-width:44ch; color:#c9d6da}
#taskHud b{color:var(--frost)}
.qlog{display:flex; flex-direction:column; gap:3px; border-top:1px solid var(--line); padding-top:10px; font-size:13.5px}
.hof{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%,320px),1fr)); gap:12px}
.hofc{background:var(--panel); border:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:8px}
.hofc .champ{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap} .hofc .champ b{font-family:var(--display); font-size:26px; color:var(--warn)}
.hofc ol{margin:0; padding-left:20px; font-size:14px} .hofx{display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--dim)} .hofx b{color:var(--frost)}
.netbar{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:16px}
.acc{display:flex; flex-direction:column; gap:10px} .acc input{background:var(--ice); border:1px solid var(--line); color:var(--frost); font:inherit; padding:8px 10px; width:100%; box-sizing:border-box} .acc .err{color:var(--bad); font-size:13px; min-height:1.2em}
.netbar input{background:var(--panel); border:1px solid var(--line); color:var(--frost); font:inherit; padding:5px 8px; width:140px}
.item.r1{background:var(--r1)} .item.r2{background:var(--r2)} .item.r3{background:var(--r3)} .item.r4{background:var(--r4)}
.item.cashi{background:#2c4a24}
.item.sel{outline:2px solid var(--signal); outline-offset:-2px}
.item.dragging{opacity:.3}
.item.hid{background:repeating-linear-gradient(45deg,#16222a 0 6px,#111b20 6px 12px); cursor:progress; display:grid; place-items:center}
.item.hid .q{font-size:16px; color:var(--dim)}
.dragghost{position:fixed; pointer-events:none; z-index:1000; opacity:.9; left:0; top:0}
.preview{position:absolute; pointer-events:none; z-index:5; outline:2px solid var(--ok); background:rgba(124,201,164,.16)}
.preview.bad{outline-color:var(--bad); background:rgba(226,87,74,.16)}
.info{background:var(--panel); border:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:10px; min-height:160px}
.info h3{font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:.03em; line-height:1}
.info .desc{margin:0; color:var(--dim); max-width:46ch}
.stats{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; margin:0; font-family:var(--mono); font-size:12px}
.stats dt{color:var(--dim)} .stats dd{margin:0; font-variant-numeric:tabular-nums}
.acts{display:flex; flex-wrap:wrap; gap:8px}
.rtag{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:2px 6px; align-self:flex-start}
.rtag.r0{background:var(--r0)} .rtag.r1{background:var(--r1)} .rtag.r2{background:var(--r2)} .rtag.r3{background:var(--r3)} .rtag.r4{background:var(--r4)}
.sellzone,.discard{border:1px dashed var(--line); padding:14px; text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.sellzone{border-color:#4d6b3a; color:var(--cash)}

/* trader */
.trader{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,auto) minmax(220px,.8fr); gap:24px; align-items:start}
@media (max-width:1180px){ .trader{grid-template-columns:minmax(0,1fr) minmax(0,auto)} .trader .info{grid-column:1 / -1} }
@media (max-width:760px){ .trader{grid-template-columns:minmax(0,1fr)} }
.ll{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.ll .pip{width:34px; height:8px; background:var(--line)}
.ll .pip.on{background:var(--signal)}
.cat h4{margin:14px 0 6px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:400}
.row{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:7px 10px; background:var(--panel); border-left:3px solid var(--r0); margin-bottom:3px}

function wstats(w){
  const d=ITEMS[w.id]; const s={magSize:d.magSize,spread:d.spread,recoil:d.recoil,zoom:d.zoom||0,noise:1,ads:1};
  const g=GUNGEO[w.id]; s.reticle=g&&g.builtin?g.builtin.kind:'iron'; s.adsSpeed=g&&g.builtin?(g.builtin.kind==='scope'?3.6:4.8):6;
  if(w.att&&w.att.optic){ const o=ITEMS[w.att.optic.id]; if(o){ s.reticle=o.reticle; s.adsSpeed=o.adsSpeed; } }
  if(w.att) for(const k in w.att){ const a=w.att[k]&&ITEMS[w.att[k].id]; if(!a) continue; if(a.magMul) s.magSize=Math.round(d.magSize*a.magMul); if(a.zoom) s.zoom=a.zoom; if(a.noise) s.noise*=a.noise; if(a.spreadMul) s.spread*=a.spreadMul; if(a.recoilMul) s.recoil*=a.recoilMul; if(a.ads) s.ads*=a.ads; }
  return s;
}

function mk(id, o={}){
  const d=ITEMS[id]; const it={uid:uid(), id, x:0, y:0, r:0};
  if(d.type==='ammo'||d.type==='cash') it.n=d.stack;
  if(d.type==='weapon'){ it.mag=0; it.ammo=CALS[d.cal][0]; it.att={optic:null,muzzle:null,mag:null}; }
  if(d.type==='armor'||d.type==='helmet') it.dur=d.dur;
  if(d.grid) it.items=[];
  if(d.hp) it.hp=d.hp;
  if(d.uses) it.uses=d.uses;
  return Object.assign(it,o);
}
const dims = it => { const d=ITEMS[it.id]; return it.r?[d.h,d.w]:[d.w,d.h]; };
function contOf(it){ const d=ITEMS[it.id]; return {w:d.grid[0], h:d.grid[1], items:it.items, own:it.id}; }
function occ(c, ignore){ const g=new Uint8Array(c.w*c.h); for(const it of c.items){ if(it===ignore) continue; const [w,h]=dims(it); for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const gx=it.x+x, gy=it.y+y; if(gx<c.w&&gy<c.h) g[gy*c.w+gx]=1; } } return g; }
function fitsG(c,g,id,x,y,r){ const d=ITEMS[id]; if(d.noPouch&&c.own&&ITEMS[c.own].type==='pouch') return false; const w=r?d.h:d.w, h=r?d.w:d.h; if(x<0||y<0||x+w>c.w||y+h>c.h) return false; for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) if(g[(y+yy)*c.w+x+xx]) return false; return true; }
function fitsAt(c,it,x,y,r,ignore){ return fitsG(c,occ(c,ignore),it.id,x,y,r); }
function place(c,it){
  const d=ITEMS[it.id];
  if(d.stack){ for(const o of c.items){ if(o.id===it.id && o.n<d.stack && !o.hid && !it.hid){ const mv=Math.min(it.n,d.stack-o.n); o.n+=mv; it.n-=mv; if(it.n<=0) return true; } } }
  const g=occ(c);
  for(const r of [0,1]) for(let y=0;y<c.h;y++) for(let x=0;x<c.w;x++) if(fitsG(c,g,it.id,x,y,r)){ it.x=x; it.y=y; it.r=r; c.items.push(it); return true; }
  return false;
}
function itemAt(c,cx,cy){ for(const it of c.items){ const [w,h]=dims(it); if(cx>=it.x&&cx<it.x+w&&cy>=it.y&&cy<it.y+h) return it; } return null; }
function valueOf(it){ const d=ITEMS[it.id]; let v=d.value*(d.stack?it.n:1); if(d.dur) v*=0.35+0.65*(it.dur/d.dur); if(d.hp) v*=0.3+0.7*(it.hp/d.hp); if(d.uses&&it.uses!=null) v*=0.3+0.7*(it.uses/d.uses); if(d.type==='weapon'&&it.mag) v+=ITEMS[it.ammo].value*it.mag; if(it.att) for(const k in it.att) if(it.att[k]) v+=ITEMS[it.att[k].id].value; return v; }
function deepValue(it){ let v=valueOf(it); if(it.items) for(const s of it.items) v+=deepValue(s); return v; }

  c.pity.vr=rar>=3?0:c.pity.vr+1; c.pity.leg=rar>=4?0:c.pity.leg+1;
  const pool=COS.filter(x=>x.rar===rar&&!x.ex); const fresh=pool.filter(x=>!cosOwned(x.id)); const from=fresh.length?fresh:pool;

  const mkb=$('#cosMake'); if(mkb) mkb.onclick=()=>{ const it=COSM[PV.sel]; const cost=SCRIP_MAKE[it.rar]; if(S.cos.scrip<cost||cosOwned(it.id)) return; S.cos.scrip-=cost; grantCos(it.id); equipCos(it.id,PV.gunId); sfxExtracted(); toast(`Made ${it.name} for ${cost} scrip.`); renderTab(); };
  $('#openCache').onclick=()=>openCache();
}
function cacheChime(rar){ const base=[392,440,523,587,659][rar]; const n=rar>=3?5:3; for(let i=0;i<n;i++) setTimeout(()=>sfxTone(base*Math.pow(1.26,i),0.5+(i===n-1?0.6:0),rar>=4?0.13:0.1,'triangle'),i*(rar>=4?140:110)); }
function openCache(){
  ensureCos(); if(!S.cos.caches) return; const res=rollCache(); saveGame(); const m=$('#cacheModal'); m.hidden=false;
  const N=44, WIN=38, CW=118; const cards=[]; const fill=()=>{ const rr_=rollRar(); const pool=COS.filter(x=>x.rar===rr_&&!x.ex); return pool[Math.floor(Math.random()*pool.length)]; };
  for(let i=0;i<N;i++) cards.push(i===WIN?res.item:fill());
  m.innerHTML=`<div class="card cachecard"><span class="lbl">Sealed cache · ${S.cos.caches} left after this one</span><h2>Opening…</h2>
   <div class="reelwrap" id="reelWrap"><div class="reel" id="reel">${cards.map((c,i)=>`<div class="rc r${c.rar}" data-i="${i}"><img src="${cosSwatch(c.id)}" alt=""><span>${esc(c.name)}</span></div>`).join('')}</div><div class="reelmark"></div></div>
   <div class="reveal" id="reveal" aria-live="polite"></div>
   <div class="acts" id="cacheActs"><button class="btn ghost" id="cacheSkip">Skip</button></div></div>`;
  const reel=$('#reel'), wrap=$('#reelWrap'); const W=wrap.getBoundingClientRect().width||600; const target=-(WIN*CW+55-W/2)+Math.round((Math.random()-0.5)*60);
  let done=false; const mode=OPTS.cacheAnim||'full'; let lastIdx=-1;
  const tick=()=>{ if(done) return; const mt=new DOMMatrixReadOnly(getComputedStyle(reel).transform); const idx=Math.floor((-mt.m41+W/2)/CW); if(idx!==lastIdx){ lastIdx=idx; sfxTone(1500,0.025,0.035,'square'); } requestAnimationFrame(tick); };
  const finish=()=>{ if(done) return; done=true; reel.style.transition='none'; reel.style.transform=`translateX(${target}px)`; const wc=reel.querySelector(`[data-i="${WIN}"]`); wc.classList.add('win');
    const it=res.item; cacheChime(it.rar); m.querySelector('h2').innerHTML=`<span style="color:${RAR_TXT[it.rar]}">${esc(it.name)}</span>`;
    $('#reveal').innerHTML=`<span class="rtag r${it.rar}">${RAR[it.rar]}</span> <span class="muted">${{coat:'Parka',pants:'Trousers',head:'Headgear',mask:'Mask',gloves:'Gloves',gun:'Weapon skin'}[it.slot]}</span><p style="margin:6px 0 0">${res.dup?`You already own every ${RAR[it.rar].toLowerCase()} item, so this one became <b>${res.scrip} scrip</b>.`:`New for your collection. +${res.scrip} scrip.`}</p>`;
    const gunNow=PV.gunId; $('#cacheActs').innerHTML=`${!res.dup?`<button class="btn" id="cacheEquip">${it.slot==='gun'?`Put on ${esc(ITEMS[gunNow].short)}`:'Wear it'}</button>`:''}${S.cos.caches?`<button class="btn ${res.dup?'':'ghost'}" id="cacheAgain">Open another (${S.cos.caches})</button>`:''}<button class="btn ghost" id="cacheDone">Done</button>`;
    const close=()=>{ m.hidden=true; m.innerHTML=''; if(TAB==='operator') renderTab(); else renderHeader(); };
    if($('#cacheEquip')) $('#cacheEquip').onclick=()=>{ if(it.slot!=='gun') PV.slot=it.slot; PV.sel=it.id; equipCos(it.id,gunNow); close(); };
    if($('#cacheAgain')) $('#cacheAgain').onclick=()=>openCache();
    $('#cacheDone').onclick=close; };
  $('#cacheSkip').onclick=finish; wrap.onclick=finish;
  if(mode==='instant'){ finish(); return; }
  const dur=mode==='short'?1.6:4.4;
  sfxNoise(0.4,500,0.25);
  // start from a laid-out frame, then animate; a timer backs up transitionend (some browsers drop it when the tab is busy)
  reel.style.transform='translateX(0px)'; void reel.offsetWidth;
  setTimeout(()=>{ if(done) return; reel.style.transition=`transform ${dur}s cubic-bezier(.1,.62,.1,1)`; reel.style.transform=`translateX(${target}px)`; tick(); },60);
  reel.addEventListener('transitionend',e=>{ if(e.target===reel) finish(); });
  setTimeout(finish,(dur+0.6)*1000);
}

}

const QMAP=Object.fromEntries(QUESTS.map(q=>[q.id,q]));
const DAILY_POOL=[
 r=>({type:'kill',kind:'scav',n:4+Math.floor(r()*5)}),
 r=>({type:'kill',kind:'raider',n:2+Math.floor(r()*3)}),
 r=>({type:'extract',map:['kolvik','whiteout','skarsvik'][Math.floor(r()*3)],n:1}),
 r=>({type:'hand',item:['bolts','tape','battery','wire','aquavit','powder','scrap'][Math.floor(r()*7)],n:2+Math.floor(r()*2)}),
 r=>({type:'kill',head:true,n:2+Math.floor(r()*3)}),
 r=>({type:'extract',minHaul:[6000,10000,15000][Math.floor(r()*3)],n:1}),
 r=>({type:'loot',n:6+Math.floor(r()*6)}),
 r=>({type:'visit',zone:['kv_mast','sk_crash','sk_lighthouse','sk_dome'][Math.floor(r()*4)],n:1}),
];
const DAILY_TITLES={kill:'Contract',extract:'Courier run',hand:'Supply request',loot:'Scavenging',visit:'Recon'};
const EK_NAMES={scav:'scav',raider:'raider',guard:"chief's guard",chief:'Station Chief Halvorsen',vguard:'vault guard',warden:'Vault Warden Brekke',foreman:'Mine Foreman Rask',mguard:'mine guard',jarl:'Jarl Hrafn',harbor:'Harbormaster Vinter',relay:'Relay Chief Dahl',huskarl:'huskarl'};
function normSave(){ ensureCos(); ensureGoals(); if(S.hide&&S.hide.armory==null) S.hide.armory=0; if(!S.crafted) S.crafted={}; if(!S.q) S.q={active:{},done:[],daily:null}; if(!S.career) S.career={raids:S.stats?S.stats.raids:0,extracts:S.stats?S.stats.extracts:0,kills:S.stats?S.stats.kills:0,seasons:[]}; ensureDailies(); if(S.q.daily) for(const d of S.q.daily.list) if(d.reward.caches==null) d.reward.caches=1; }
const dayKey=()=>Math.floor(Date.now()/864e5);
function ensureDailies(){
  const day=dayKey(); if(S.q.daily&&S.q.daily.day===day) return;
  const r=mulberry32(hashStr(String(day)+(ACC.name||'guest'))); const pool=DAILY_POOL.slice(); const list=[];
  for(let i=0;i<3;i++){ const f=pool.splice(Math.floor(r()*pool.length),1)[0]; const o=f(r); list.push({id:'d'+day+'-'+i,giver:'Daily',title:DAILY_TITLES[o.type],text:'',obj:[o],p:[0],reward:{cash:2000+Math.round(r()*30)*100,caches:1},done:false}); }
  S.q.daily={day,list};
}
function objLabel(o){
  if(o.label) return o.label; const mapN=o.map?MAPS[o.map].name:null;
  switch(o.type){
    case 'kill': return `Kill ${o.n} ${o.kind?EK_NAMES[o.kind]+(o.n>1?'s':''):(o.n>1?'enemies':'enemy')}${o.head?' with headshots':''}${mapN?' on '+mapN:''}`;
    case 'extract': return `Extract${mapN?' from '+mapN:' from any raid'}${o.minHaul?` carrying ${fmt$(o.minHaul)} or more`:''}`;
    case 'hand': return `Hand over ${o.n} × ${ITEMS[o.item].name}`;
    case 'loot': return `Search ${o.n} containers or bodies`;
    case 'visit': return `Reach ${ZONES[o.zone].name} on ${MAPS[ZONES[o.zone].map].name}`;
    case 'craft': return `Build the ${ITEMS[o.item].name} at the Armory`;
  }
  return '';
}
function qEachActive(fn){
  for(const id in S.q.active){ const q=QMAP[id]; if(!q) continue; q.obj.forEach((o,i)=>fn(o,S.q.active[id].p,i,q.title)); }
  if(S.q.daily) for(const d of S.q.daily.list) if(!d.done) d.obj.forEach((o,i)=>fn(o,d.p,i,d.title));
}
function qBump(match){
  qEachActive((o,p,i,title)=>{ if(p[i]>=o.n) return; const inc=match(o); if(!inc) return; p[i]=Math.min(o.n,p[i]+inc); const line=`${title}: ${objLabel(o)} ${p[i]}/${o.n}`; if(R){ (R.qlog=R.qlog||[]).push(line); if(!R.over) msg('Task · '+line+(p[i]>=o.n?' ✓':'')); } });
}
function qKill(e,head,w){ const dist=e.pos?Math.hypot(e.pos.x-P.pos.x,e.pos.z-P.pos.z):0; const wid=w||e.lastW; qBump(o=>o.type==='kill'&&(!o.kind||o.kind===e.kind)&&(!o.map||o.map===R.map)&&(!o.weapon||o.weapon===wid)&&(!o.head||head)&&(!o.minDist||dist>=o.minDist)?1:0); }
function qVisit(){ qEachActive((o,p,i,title)=>{ if(o.type!=='visit'||p[i]>=1) return; const z=ZONES[o.zone]; if(z.map!==R.map) return; if(Math.hypot(z.x-P.pos.x,z.z-P.pos.z)<z.r){ p[i]=1; const line=`${title}: ${objLabel(o)} ✓`; (R.qlog=R.qlog||[]).push(line); msg('Task · '+line); sfxBeep(); } }); }
function taskHud(){
  const lines=[]; qEachActive((o,p,i)=>{ if(p[i]>=o.n||o.type==='hand'||o.type==='craft') return; if(o.map&&o.map!==R.map) return; if(o.type==='visit'&&ZONES[o.zone].map!==R.map) return; lines.push(`<div>${esc(objLabel(o))} <b>${p[i]}/${o.n}</b></div>`); });
  $('#taskHud').innerHTML=lines.length?'<span class="lbl">Tasks</span>'+lines.slice(0,4).join(''):'';
}
const qDone=q=>q.obj.every((o,i)=>(S.q.active[q.id]||{p:[]}).p[i]>=o.n);
const dDone=d=>d.obj.every((o,i)=>d.p[i]>=o.n);

function taskBadge(){ const b=$('#taskBadge'); if(!b||!S.q) return; ensureDailies(); let n=0; for(const id in S.q.active) if(QMAP[id]&&qDone(QMAP[id])) n++; for(const d of S.q.daily.list) if(!d.done&&dDone(d)) n++; b.hidden=!n; b.textContent=String(n); }
function stashQty(id){ let n=0; for(const it of S.stash.items) if(it.id===id&&!(it.items&&it.items.length)) n+=ITEMS[id].stack?it.n:1; return n; }
function takeFromStash(id,n){ for(const it of S.stash.items.slice()){ if(n<=0) break; if(it.id!==id||(it.items&&it.items.length)) continue; if(ITEMS[id].stack){ const t=Math.min(n,it.n); it.n-=t; n-=t; if(it.n<=0) S.stash.items.splice(S.stash.items.indexOf(it),1); } else { S.stash.items.splice(S.stash.items.indexOf(it),1); n--; } } }
function giveReward(rw,title){
  const items=(rw.items||[]).map(([id,o])=>mk(id,Object.assign({},o||{}))); const tmp={w:S.stash.w,h:S.stash.h,items:S.stash.items.slice()};
  for(const it of items) if(!placeNoMerge(tmp,it)){ toast('Make room in your stash for the reward first.'); return false; }
  S.stash.items=tmp.items; S.cash+=rw.cash||0; const before=loyalty(); if(rw.loyalty) S.spent+=rw.loyalty;
  ensureCos(); if(rw.caches) S.cos.caches+=rw.caches; const cos=(rw.cos||[]).filter(grantCos);
  const extra=[...items.map(i=>ITEMS[i.id].name),...(rw.caches?[`${rw.caches} sealed cache${rw.caches===1?'':'s'}`]:[]),...cos.map(id=>COSM[id].name)];
  sfxExtracted(); toast(`${title} complete: ${fmt$(rw.cash||0)}${extra.length?` and ${extra.join(', ')}`:''}.`+(loyalty()>before?` Loyalty ${loyalty()} reached.`:'')); return true;

function goalVal(G){ const g=ensureGoals(), c=g.c;
  switch(G.stat){ case 'maps': return Object.keys(g.maps).length; case 'bosses': return Object.keys(g.bosses).length; case 'keys': return Object.keys(g.keys).length;

/* ================= MENU MUSIC (original, synthesized) ================= */
// Slow monastic chant over choir pads, then piano and low drums. Original composition in D minor.
const MUS = {ctx:null, on:false, master:null, rev:null, timer:null, step:0, next:0};
function ensureAudio(){
  if(!MUS.ctx){ try{ MUS.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } buildAudioGraph(); }
  if(MUS.ctx.state==='suspended') MUS.ctx.resume();
  return MUS.ctx;
}
function buildAudioGraph(){
  const a=MUS.ctx;
  MUS.out=a.createGain(); MUS.out.gain.value=0.9; MUS.out.connect(a.destination);
  MUS.master=a.createGain(); MUS.master.gain.value=0; MUS.master.connect(MUS.out);
  // generated hall reverb
  const len=a.sampleRate*4.5, ir=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
  MUS.rev=a.createConvolver(); MUS.rev.buffer=ir; const rg=a.createGain(); rg.gain.value=0.75; MUS.rev.connect(rg); rg.connect(MUS.master);
  MUS.dry=a.createGain(); MUS.dry.gain.value=0.45; MUS.dry.connect(MUS.master);
  // sfx bus
  MUS.sfx=a.createGain(); MUS.sfx.gain.value=0.8; MUS.sfx.connect(MUS.out);
  const nl=a.sampleRate*0.8; MUS.noise=a.createBuffer(1,nl,a.sampleRate); const nd=MUS.noise.getChannelData(0); for(let i=0;i<nl;i++) nd[i]=Math.random()*2-1;
}
const mtof = m => 440*Math.pow(2,(m-69)/12);
function send(node){ node.connect(MUS.dry); node.connect(MUS.rev); }
// choir "aah" voice: two detuned saws through vowel formants
function voice(t, midi, dur, vol, att=1.6){
  const a=MUS.ctx, g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.setValueAtTime(vol,t+Math.max(att,dur-1.2)); g.gain.linearRampToValueAtTime(0,t+dur+1.5);
  const sum=a.createGain(); sum.gain.value=0.5;
  [-7,6].forEach(cents=>{ const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(midi); o.detune.value=cents; const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=4.6+Math.random()*0.8; lg.gain.value=5; lfo.connect(lg); lg.connect(o.detune); o.connect(sum); o.start(t); o.stop(t+dur+1.6); lfo.start(t); lfo.stop(t+dur+1.6); });
  [[700,6,1],[1150,7,.55],[2600,9,.18]].forEach(([f,q,gn])=>{ const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q; const fg=a.createGain(); fg.gain.value=gn; sum.connect(bp); bp.connect(fg); fg.connect(g); });
  send(g);
}
function piano(t, midi, vol){
  const a=MUS.ctx, g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(vol*0.25,t+0.6); g.gain.exponentialRampToValueAtTime(0.0008,t+3.2);
  [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12]].forEach(([h,ty,gv])=>{ const o=a.createOscillator(); o.type=ty; o.frequency.value=mtof(midi)*h; const og=a.createGain(); og.gain.value=gv; o.connect(og); og.connect(g); o.start(t); o.stop(t+3.3); });
  send(g);
}
function strings(t, midi, dur, vol){
  const a=MUS.ctx, g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+2); g.gain.setValueAtTime(vol,t+dur-1); g.gain.linearRampToValueAtTime(0,t+dur+1);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.connect(g);
  [-4,4].forEach(c=>{ const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(midi); o.detune.value=c; o.connect(lp); o.start(t); o.stop(t+dur+1.1); });
  send(g);
}
function drum(t, vol, pitch=58){
  const a=MUS.ctx, o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(pitch*2.2,t); o.frequency.exponentialRampToValueAtTime(pitch,t+0.18);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+1.1); o.connect(g); send(g); o.start(t); o.stop(t+1.2);
  const n=a.createBufferSource(); n.buffer=MUS.noise; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const ng=a.createGain(); ng.gain.setValueAtTime(vol*0.25,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.12); n.connect(f); f.connect(ng); send(ng); n.start(t); n.stop(t+0.15);
}
// chord roots + voicings (original progression), 1 bar = 4.4s
const BAR=4.4;
const PROG=[[50,[62,65,69]],[46,[62,65,70]],[53,[60,65,69]],[48,[60,64,67]],[50,[62,65,69]],[43,[62,67,70]],[46,[62,65,70]],[45,[61,64,69]]];
// chant melody per bar: [beat offset in bars, midi, length in bars]
const CHANT=[
 [[0,62,.5],[.5,64,.25],[.75,65,.25]],[[0,67,.5],[.5,65,.5]],[[0,64,.75],[.75,62,.25]],[[0,64,1]],
 [[0,62,.25],[.25,65,.25],[.5,69,.5]],[[0,67,.5],[.5,70,.5]],[[0,69,.5],[.5,67,.25],[.75,65,.25]],[[0,64,.5],[.5,61,.5]]];
const ARP=[0,2,1,2,0,2,1,3];
function scheduleBar(i, t){
  const cycle=Math.floor(i/8), b=i%8, [root,ch]=PROG[b];
  const section = cycle%4; // 0 pads, 1 +chant, 2 +piano+drums, 3 full
  ch.forEach((m,k)=>voice(t+k*0.05, m, BAR, 0.05));
  voice(t, root+12, BAR, 0.045);
  strings(t, root-12, BAR, 0.05);
  if(section>=1) CHANT[b].forEach(([o,m,l])=>voice(t+o*BAR, m-12, l*BAR, 0.075, 0.25));
  if(section>=2){ const notes=[root+24, ...ch.map(m=>m+12)]; for(let s=0;s<8;s++){ pianoN(t+s*BAR/8, notes[ARP[s]], 0.28, BAR*0.6); } }
  if(section===3) playMel(t, BAR/4, CHANT_VLN[b], (tt,m,d)=>violin(tt,m,d,0.05,{pan:0.25}));
  if(section>=2){ drum(t,0.5); drum(t+BAR*0.5,0.28); if(section===3){ drum(t+BAR*0.75,0.2,70); drum(t+BAR*0.875,0.2,70); } }
}
/* ---- instruments ---- */
function outNode(node,pan=0,wet=0.8){ const a=MUS.ctx; if(MUS.vmul&&MUS.vmul!==1){ const vg=a.createGain(); vg.gain.value=MUS.vmul; node.connect(vg); node=vg; } let pn=node; if(a.createStereoPanner){ pn=a.createStereoPanner(); pn.pan.value=clamp(pan,-1,1); node.connect(pn); } pn.connect(MUS.dry); const w=a.createGain(); w.gain.value=wet; pn.connect(w); w.connect(MUS.rev); }
// bowed strings: detuned saws through violin-body resonances, vibrato that blooms after the attack, a little bow noise
function bowed(t,midi,dur,vol,o={}){
  const a=MUS.ctx, f=mtof(midi), n=o.voices||3, att=o.att!=null?o.att:0.12, rel=o.rel!=null?o.rel:0.35;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att);
  if(dur>1.2){ g.gain.linearRampToValueAtTime(vol*1.15,t+dur*0.6); g.gain.linearRampToValueAtTime(vol*0.95,t+dur); } else g.gain.setValueAtTime(vol,t+Math.max(att,dur));
  g.gain.linearRampToValueAtTime(0.0001,t+dur+rel);
  const mix=a.createGain(); mix.gain.value=1/n;
  for(let i=0;i<n;i++){ const osc=a.createOscillator(); osc.type='sawtooth'; osc.frequency.value=f; osc.detune.value=(i-(n-1)/2)*(o.detune!=null?o.detune:6)+(Math.random()-0.5)*3;
    if(o.vib!==0){ const lfo=a.createOscillator(); lfo.frequency.value=(o.vibHz||5.4)+(Math.random()-0.5)*0.7; const lg=a.createGain(); lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(o.vib||13,t+Math.min(dur,0.55)); lfo.connect(lg); lg.connect(osc.detune); lfo.start(t); lfo.stop(t+dur+rel+0.05); }
    osc.connect(mix); osc.start(t); osc.stop(t+dur+rel+0.05); }
  const hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=Math.max(50,f*0.6);
  const b1=a.createBiquadFilter(); b1.type='peaking'; b1.frequency.value=o.f1||480; b1.gain.value=4; b1.Q.value=1.2;
  const b2=a.createBiquadFilter(); b2.type='peaking'; b2.frequency.value=o.f2||2900; b2.gain.value=5; b2.Q.value=1.4;
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=o.bright||3800; lp.Q.value=0.6;
  mix.connect(hp); hp.connect(b1); b1.connect(b2); b2.connect(lp); lp.connect(g);
  if(att<0.3){ const nz=a.createBufferSource(); nz.buffer=MUS.noise; const nf=a.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=Math.min(8000,f*3); nf.Q.value=2; const ng=a.createGain(); ng.gain.setValueAtTime(vol*0.22,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.14); nz.connect(nf); nf.connect(ng); ng.connect(g); nz.start(t,Math.random()*0.5); nz.stop(t+0.16); }
  outNode(g,o.pan||0,o.wet!=null?o.wet:0.85);
}
const violin=(t,m,d,v,o={})=>bowed(t,m,d,v,Object.assign({voices:2,detune:4,vib:16,bright:5200,att:0.1},o));
const vSection=(t,m,d,v,o={})=>bowed(t,m,d,v,Object.assign({voices:4,detune:10,vib:10,bright:3800,att:0.35,rel:0.6},o));
const cello=(t,m,d,v,o={})=>bowed(t,m,d,v,Object.assign({voices:3,detune:7,vib:9,vibHz:5,bright:1700,f1:250,f2:1200,att:0.2,pan:-0.3},o));
const spicc=(t,m,v,o={})=>bowed(t,m,0.06,v,Object.assign({voices:2,detune:8,vib:0,bright:4200,att:0.008,rel:0.09,wet:0.5},o));
// piano: slightly inharmonic partials on two detuned strings, hammer thump, low notes ring longer; dur is when the damper falls
function pianoN(t,midi,vel=0.4,dur=2.5,pan){
  const a=MUS.ctx, f=mtof(midi); const g=a.createGain(); g.gain.setValueAtTime(vel,t); g.gain.setValueAtTime(vel,t+dur); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.4);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(11000,900+vel*7000+f*1.5);
  const dec=Math.max(1.4,7-(midi-40)*0.09); const end=t+Math.min(dec,dur+0.45)+0.05;
  for(let k=1;k<=5;k++){ const fk=f*k*Math.sqrt(1+0.0004*k*k); if(fk>14000) break; const amp=(k===1?0.5:0.32)/Math.pow(k,1.2); const d=dec/(1+(k-1)*0.6);
    for(const det of (k<=2?[-1.4,1.4]:[0])){ const o=a.createOscillator(); o.type='sine'; o.frequency.value=fk; o.detune.value=det; const og=a.createGain();
      og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(amp,t+0.004); og.gain.exponentialRampToValueAtTime(amp*0.4,t+Math.min(0.3,d*0.12)); og.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(og); og.connect(lp); o.start(t); o.stop(end); } }
  const nz=a.createBufferSource(); nz.buffer=MUS.noise; const nf=a.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=Math.min(6000,f*4); nf.Q.value=1; const ng=a.createGain(); ng.gain.setValueAtTime(vel*0.12,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.03); nz.connect(nf); nf.connect(ng); ng.connect(g); nz.start(t,Math.random()*0.5); nz.stop(t+0.04);
  lp.connect(g); outNode(g,pan!=null?pan:clamp((midi-62)/36,-0.6,0.6),0.6);
}
function timp(t,midi,vel=0.5){ const a=MUS.ctx, f=mtof(midi); const o=a.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*1.08,t); o.frequency.exponentialRampToValueAtTime(f,t+0.08); const g=a.createGain(); g.gain.setValueAtTime(vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+1.8); o.connect(g); o.start(t); o.stop(t+1.9);
  const o2=a.createOscillator(); o2.type='sine'; o2.frequency.value=f*1.5; const g2=a.createGain(); g2.gain.setValueAtTime(vel*0.3,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.6); o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t+0.7);
  const nz=a.createBufferSource(); nz.buffer=MUS.noise; const nf=a.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=500; const ng=a.createGain(); ng.gain.setValueAtTime(vel*0.4,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.08); nz.connect(nf); nf.connect(ng); ng.connect(g); nz.start(t); nz.stop(t+0.1); outNode(g,-0.1,0.7); }
function timpRoll(t,midi,dur,v0,v1){ const n=Math.floor(dur/0.07); for(let i=0;i<n;i++) timp(t+i*0.07,midi,(v0+(v1-v0)*i/n)*(0.8+Math.random()*0.3)); }
function swell(t,dur,vol){ const a=MUS.ctx; const nz=a.createBufferSource(); nz.buffer=MUS.noise; nz.loop=true; const hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000; const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur); g.gain.linearRampToValueAtTime(0,t+dur+0.4); nz.connect(hp); hp.connect(g); outNode(g,0,1); nz.start(t); nz.stop(t+dur+0.5); }
function snare(t,vol){ const a=MUS.ctx; const nz=a.createBufferSource(); nz.buffer=MUS.noise; const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.8; const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); nz.connect(bp); bp.connect(g); outNode(g,0.1,0.6); nz.start(t,Math.random()*0.5); nz.stop(t+0.2); }

/* ---- notation helpers: "E5:1.5 G5:.5 r:1" = note:beats ---- */
const NOTE_IX={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nm(x){ const m=/^([A-G])([#b]?)(-?\d)$/.exec(x); return 12*(+m[3]+1)+NOTE_IX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); }
function mel(str){ const out=[]; let b=0; for(const tok of str.trim().split(/\s+/)){ const [n,l]=tok.split(':'); const len=+l; if(n!=='r') out.push([b,nm(n),len]); b+=len; } return out; }
function playMel(t,beat,str,fn){ if(!str) return; for(const [b,m,l] of mel(str)) fn(t+b*beat,m,l*beat); }
const chordM=str=>str.trim().split(/\s+/).map(nm);
const CHANT_VLN=['A5:2 F5:2','F5:2 D5:2','C6:2 A5:2','G5:4','A5:1 C6:1 D6:2','D6:2 Bb5:2','F6:2 D6:2','E6:4'];

const FL={beat:60/72,
 ch:{Em:['E2','E3 B3 E4 G4 B4 G4 E4 B3','E3 G3 B3 E4'],C:['C2','C3 G3 C4 E4 G4 E4 C4 G3','C3 E3 G3 C4'],G:['G1','G2 D3 G3 B3 D4 B3 G3 D3','G2 B2 D3 G3'],DF:['F#2','D3 A3 D4 F#4 A4 F#4 D4 A3','D3 F#3 A3 D4'],
     Am:['A1','A2 E3 A3 C4 E4 C4 A3 E3','A2 C3 E3 A3'],B:['B1','B2 F#3 B3 D#4 F#4 D#4 B3 F#3','B2 D#3 F#3 B3'],D:['D2','D3 A3 D4 F#4 A4 F#4 D4 A3','D3 F#3 A3 D4'],EmD:['D2','E3 B3 E4 G4 B4 G4 E4 B3','D3 G3 B3 E4']},
 prog:['Em','C','G','DF','Em','Am','C','B', 'Em','C','G','DF','Em','Am','C','B', 'C','D','Em','EmD','C','D','B','B', 'Em','C','G','DF','Em','Am','C','Em'],
 motif:['E5:1.5 G5:.5 F#5:1 D5:1','E5:2 C5:1 B4:1','D5:1.5 E5:.5 G5:1 B5:1','A5:3 F#5:1','G5:1.5 F#5:.5 E5:1 B4:1','C5:1.5 D5:.5 E5:1 A5:1','G5:2 E5:1 D5:1','D#5:3 r:1'],
 answer:['B4:1 E5:1 G5:1 B5:1','C6:2 B5:1 A5:1','G5:2 E5:1 G5:1','F#5:3 D#5:1'],

function frostBar(i,t,bar){
  const B=FL.beat, c=FL.ch[FL.prog[i]], bass=nm(c[0]), arp=chordM(c[1]), pad=chordM(c[2]);
  const sec=i<8?0:i<16?1:i<24?2:3;
  // piano arpeggio in eighths with the pedal down for the bar
  const soft=sec===2?0.2:sec===3?0.17:0.22;
  if(i<31) arp.forEach((m,k)=>pianoN(t+k*B/2,m,soft*(k===0?1.25:1),bar*0.95));
  if(i<31) pianoN(t,bass,0.3,bar);
  if(sec===0) playMel(t,B,FL.motif[i],(tt,m,d)=>pianoN(tt,m,0.42,d*1.1,0.15));
  if(sec===1){ const ph=i<12?FL.motif[i-8]:FL.answer[i-12]; playMel(t,B,ph,(tt,m,d)=>violin(tt,m,d,0.075,{pan:0.2}));
    cello(t,bass+12,bar,0.06); }

    pad.slice(1).forEach(m=>vSection(t,m+12,bar,0.035,{pan:-0.35})); cello(t,bass+12,bar,0.07); cello(t,bass,bar,0.05,{pan:0});
    pad.forEach(m=>voice(t,m+12,bar,0.022,0.8));
    pianoN(t,bass,0.45,bar); pianoN(t,bass-12,0.35,bar);
    if(i===16||i===20) timp(t,40,0.55); if(i===19) swell(t+bar*0.5,bar*0.5,0.03); if(i===22) timpRoll(t,47,bar*2,0.12,0.5); if(i===23){ timp(t+bar-0.01,40,0.6); } }
  if(sec===3){ if(i<30) playMel(t,B,FL.motif[i-24],(tt,m,d)=>pianoN(tt,m,0.36,d*1.2,0.15));
    vSection(t,nm('E6'),bar,0.018,{pan:0.3,att:1.2}); cello(t,bass,bar,0.04);
    if(i===31){ chordM('E2 B2 E3 G3 B3 F#4 B4').forEach((m,k)=>pianoN(t+k*0.06,m,0.3,bar*2.2)); vSection(t,nm('B5'),bar*1.8,0.03,{att:0.8}); vSection(t,nm('G5'),bar*1.8,0.03,{att:0.8,pan:-0.3}); } }

// French horn: two saws and a triangle through a lowpass that opens as the note speaks, a touch of vibrato
function horn(t,midi,dur,vol,o={}){
  const a=MUS.ctx, f=mtof(midi), att=o.att!=null?o.att:0.09, rel=o.rel!=null?o.rel:0.4;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.setValueAtTime(vol,t+Math.max(att,dur-0.05)); g.gain.linearRampToValueAtTime(0.0001,t+dur+rel);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.8; const top=Math.min(4200,f*(o.bright||3.2)); lp.frequency.setValueAtTime(f*1.2,t); lp.frequency.linearRampToValueAtTime(top,t+att*1.6); lp.frequency.linearRampToValueAtTime(top*0.75,t+Math.max(att*2,dur));
  const pk=a.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=480; pk.gain.value=5; pk.Q.value=1;
  const mix=a.createGain(); mix.gain.value=0.33;
  for(const [ty,det] of [['sawtooth',-4],['sawtooth',5],['triangle',0]]){ const osc=a.createOscillator(); osc.type=ty; osc.frequency.value=f; osc.detune.value=det;
    const lfo=a.createOscillator(); lfo.frequency.value=4.8+Math.random()*0.5; const lg=a.createGain(); lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(o.vib!=null?o.vib:6,t+Math.min(dur,0.7)); lfo.connect(lg); lg.connect(osc.detune); lfo.start(t); lfo.stop(t+dur+rel+0.1);
    osc.connect(mix); osc.start(t); osc.stop(t+dur+rel+0.1); }
  mix.connect(lp); lp.connect(pk); pk.connect(g); outNode(g,o.pan||0,o.wet!=null?o.wet:0.9);
}
// harp: a plucked string, bright for an instant and then round
function harp(t,midi,vol,pan){
  const a=MUS.ctx, f=mtof(midi), dec=Math.max(1.2,4.5-(midi-48)*0.06); const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.004); g.gain.exponentialRampToValueAtTime(vol*0.35,t+0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(Math.min(9000,f*8),t); lp.frequency.exponentialRampToValueAtTime(Math.max(400,f*2),t+0.4);
  for(const [h,gv,ty] of [[1,0.6,'triangle'],[2,0.25,'sine'],[3,0.08,'sine']]){ const o=a.createOscillator(); o.type=ty; o.frequency.value=f*h; const og=a.createGain(); og.gain.value=gv; o.connect(og); og.connect(lp); o.start(t); o.stop(t+dec+0.05); }
  lp.connect(g); outNode(g,pan!=null?pan:clamp((midi-60)/30,-0.5,0.5),0.75);
}
// celesta / glockenspiel: a sine with a bell partial a few octaves up, long gentle decay
function celesta(t,midi,vol,o={}){
  const a=MUS.ctx, f=mtof(midi), dec=o.dec||3.2; const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
  for(const [h,gv,d] of [[1,0.7,1],[4,0.18,0.35],[o.glock?2.76:3,o.glock?0.2:0.06,0.5]]){ const os=a.createOscillator(); os.type='sine'; os.frequency.value=f*h; const og=a.createGain(); og.gain.setValueAtTime(gv,t); og.gain.exponentialRampToValueAtTime(0.0001,t+dec*d); os.connect(og); og.connect(g); os.start(t); os.stop(t+dec+0.05); }
  outNode(g,o.pan!=null?o.pan:0.35,0.9);

// one step down the white-key (D dorian) scale, twice: a third below in the mode
function dorian3rd(m){ const W=[0,2,4,5,7,9,11]; const pc=((m%12)+12)%12, oct=Math.floor(m/12); let ix=W.indexOf(pc); if(ix<0) return m-3; ix-=2; let o2=oct; if(ix<0){ ix+=7; o2--; } return o2*12+W[ix]; }

// snare and low strings, the horn tune, the second strain with strings, the tune again with everyone
function marchBar(i,t,bar){
  const B=SV.beat, sec=Math.floor(i/8), k=i%8, name=(sec===2?SV.progB:SV.progA)[k], c=SV.ch[name], bass=nm(c[0]), ch=chordM(c[1]); const last=i===31;
  if(last){ chordM('G1 G2 D3 G3 Bb3 D4 G4').forEach((m,j)=>pianoN(t+j*0.03,m,0.35,bar*2)); horn(t,nm('G4'),bar*1.5,0.07); horn(t,nm('D4'),bar*1.5,0.06,{pan:0.3}); horn(t,nm('Bb3'),bar*1.5,0.055,{pan:-0.3}); timp(t,nm('G2'),0.7); cello(t,nm('G2'),bar*1.5,0.08); drum(t,0.6,45); return; }
  // pulsing low strings in eighths, the root and its octave
  for(let e=0;e<8;e++) cello(t+e*B/2,bass+12+(e%4===2?12:0),B*0.38,0.045*(e%2?0.75:1),{att:0.02,rel:0.1,vib:0,wet:0.5});
  // the drum line: snare on 2 and 4 with a roll into every fourth bar, a bass drum on 1 and 3
  drum(t,0.42,48); drum(t+B*2,0.32,48); snare(t+B,0.07); snare(t+B*3,0.07); snare(t+B*3.5,0.035); if(k%4===3){ for(let r=0;r<6;r++) snare(t+B*2+r*B/6,0.025+r*0.007); }
  if(sec>=1){ const tune=sec===2?SV.B[k]:SV.A[k]; playMel(t,B,tune,(tt,m,d)=>{ horn(tt,m,d*0.92,sec===3?0.085:0.075,{pan:-0.1}); if(sec===3) horn(tt,m-12,d*0.92,0.05,{pan:0.25}); }); }
  if(sec>=2){ ch.forEach(m=>vSection(t,m+12,bar,0.025,{att:0.25,pan:0.3})); }
  if(sec===2) playMel(t,B,SV.B[k],(tt,m,d)=>violin(tt,m+12,d,0.035,{pan:0.25}));
  if(sec===3){ timp(t,bass<41?bass+12:bass,0.4); if(k%2) timp(t+B*2,bass<41?bass+12:bass,0.25); ch.forEach(m=>horn(t,m,bar*0.9,0.025,{pan:0.35,att:0.3})); }
  if(sec===0&&k>=4) horn(t,ch[0]+12,bar*0.9,0.03,{att:0.4,pan:0.2});
}

/* 32-music-slavic: Russian / Slavic pieces. New instruments (balalaika, contrabass balalaika, gusli, bayan, church
   bells, a low male choir, buben) and four original tracks appended to TRACKS: Zvon, Steppe Wind, Birch Waltz, Trepak.
   A track may give barAt(i) instead of a fixed bar length when its tempo changes (Trepak speeds up, the waltz slows
   at the end); musicTick in 30-music.js uses it. */

/* ---- plucked strings by Karplus-Strong: a burst of noise circulating in a delay line that loses its highs each pass.
   Each pitch/tone is computed once into a buffer and cached; the buffer plays back at a rate that corrects the
   tuning to the exact frequency. ---- */
const KS_CACHE=new Map();
function ksBuffer(midi,o){
  const a=MUS.ctx, sr=a.sampleRate, bright=o.bright!=null?o.bright:0.7, sus=o.sus||1.4, pos=o.pos!=null?o.pos:0.12;
  const key=`${midi}|${bright}|${sus}|${pos}|${sr}`; const hit=KS_CACHE.get(key); if(hit) return hit;
  if(KS_CACHE.size>400) KS_CACHE.clear();
  const f=mtof(midi), s=0.5, N=Math.max(4,Math.floor(sr/f-s)), len=Math.ceil(sr*Math.min(6,sus*1.15+0.1)), d=new Float32Array(len);
  const g=Math.pow(0.001,1/(sus*f)); // loss per pass, for the requested ring time
  let lp=0; for(let i=0;i<N;i++){ lp+=((Math.random()*2-1)-lp)*bright; d[i]=lp; }
  const P=Math.max(1,Math.round(N*pos)); for(let i=N-1;i>=P;i--) d[i]-=d[i-P]; // where the string is plucked
  let mean=0; for(let i=0;i<N;i++) mean+=d[i]; mean/=N; for(let i=0;i<N;i++) d[i]-=mean;
  d[N]=g*d[0]; for(let i=N+1;i<len;i++) d[i]=g*((1-s)*d[i-N]+s*d[i-N-1]);
  let pk=1e-6; for(let i=0;i<len;i++){ const v=Math.abs(d[i]); if(v>pk) pk=v; }
  const fade=Math.min(len,Math.floor(sr*0.05)); for(let i=0;i<len;i++){ d[i]/=pk; if(i>len-fade) d[i]*=(len-i)/fade; }
  const buf=a.createBuffer(1,len,sr); buf.copyToChannel(d,0);
  const e={buf,rate:f*(N+s)/sr}; KS_CACHE.set(key,e); return e;
}
// o.stop damps the string (the next tremolo stroke, or a hand on the strings); o.body = resonances [[Hz,dB,Q]]
function pluck(t,midi,vol,o={}){
  const a=MUS.ctx, e=ksBuffer(midi,o); const src=a.createBufferSource(); src.buffer=e.buf; src.playbackRate.value=e.rate;
  const g=a.createGain(); g.gain.setValueAtTime(vol,t);
  const end=t+e.buf.duration/e.rate; let stop=end;
  if(o.stop!=null&&o.stop<end){ stop=o.stop+0.035; g.gain.setValueAtTime(vol,o.stop); g.gain.linearRampToValueAtTime(0.0001,stop); }
  let node=src; for(const [fq,gain,q] of (o.body||[])){ const b=a.createBiquadFilter(); b.type='peaking'; b.frequency.value=fq; b.gain.value=gain; b.Q.value=q; node.connect(b); node=b; }
  if(o.lp){ const l=a.createBiquadFilter(); l.type='lowpass'; l.frequency.value=o.lp; node.connect(l); node=l; }
  node.connect(g); src.start(t); src.stop(stop+0.01);
  outNode(g,o.pan!=null?o.pan:clamp((midi-64)/40,-0.5,0.5),o.wet!=null?o.wet:0.55);
}
// balalaika: steel strings plucked close to the bridge, a small triangular body
const balalaika=(t,m,v,o={})=>pluck(t,m,v,Object.assign({bright:0.88,sus:1.1,pos:0.07,body:[[330,5,1.4],[2700,4,1.1]],wet:0.5},o));
// contrabass balalaika: the big one that plays the bass
const contrabass=(t,m,v,o={})=>pluck(t,m,v,Object.assign({bright:0.42,sus:1.2,pos:0.22,body:[[120,5,1]],lp:1800,pan:-0.2,wet:0.4},o));
// gusli: a zither with long-ringing strings
const gusli=(t,m,v,o={})=>pluck(t,m,v,Object.assign({bright:0.6,sus:3.4,pos:0.17,body:[[520,3,1]],wet:0.95},o));
// tremolo: the same note re-plucked quickly, each stroke damping the last (how balalaika and domra sustain a tune)
function tremolo(t,midi,dur,vol,o={}){
  const rate=o.rate||12.5, n=Math.max(1,Math.round(dur*rate)), inst=o.inst||balalaika;
  for(let k=0;k<n;k++){ const tt=t+k/rate+(Math.random()-0.5)*0.005; const sw=n>3?0.85+0.3*Math.sin(Math.PI*k/(n-1)):1;
    inst(tt,midi,vol*(k%2?0.7:1)*sw,Object.assign({},o,{stop:k<n-1?t+(k+1)/rate:t+dur+(o.ring||0.12)})); }
}
// strum a chord: a quick roll across the strings, down (low to high) or up
function strum(t,notes,vol,o={}){ const ns=o.up?notes.slice().reverse():notes; ns.forEach((m,j)=>(o.inst||balalaika)(t+j*(o.roll||0.011),m,vol*(j===0?1:0.85),{stop:o.stop,pan:o.pan})); }

/* ---- bayan (button accordion): free reeds, bright and buzzy, sounding as long as the bellows push ---- */
function reedWave(){ const a=MUS.ctx; if(MUS._rw&&MUS._rwCtx===a) return MUS._rw; const n=48, re=new Float32Array(n), im=new Float32Array(n);
  for(let k=1;k<n;k++) im[k]=Math.pow(k,-0.85)*(1+1.1*Math.exp(-Math.pow((k-5)/3,2)))*(k%2?1:0.7);
  MUS._rw=a.createPeriodicWave(re,im); MUS._rwCtx=a; return MUS._rw; }
// o.reeds = detune in cents for each reed (two slightly apart is the "musette" wobble), o.low adds the bassoon reed an octave down
function bayan(t,midi,dur,vol,o={}){
  const a=MUS.ctx, f=mtof(midi), att=o.att!=null?o.att:0.03, rel=o.rel!=null?o.rel:0.09;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att);
  if(dur>0.8){ g.gain.linearRampToValueAtTime(vol*(o.swell||1.12),t+dur*0.55); g.gain.linearRampToValueAtTime(vol*0.95,t+dur); }
  else g.gain.setValueAtTime(vol,t+Math.max(att,dur));
  g.gain.linearRampToValueAtTime(0.0001,t+Math.max(att,dur)+rel);
  const reeds=(o.reeds||[0,7]).map(c=>[c,1]); if(o.low) reeds.push([0,0.55,-12]);
  const mix=a.createGain(); mix.gain.value=0.6/reeds.length;

/* 33-music-chant: more Orthodox church pieces in the style of Zvon: a low male choir, a drone (ison), bells.
   Uses the instruments from 32-music-slavic.js (choirM, bell, dia). Five tracks appended to TRACKS:
   Vespers, Perezvon, Trezvon, Night Vigil, and Zvon (Long), which starts as Zvon and keeps going. */
const G_MIN=[0,2,3,5,7,9,10], E_MIN=[0,2,4,6,7,9,11], D_MAJ=[1,2,4,6,7,9,11];
const VOW=['o','a','o','e','o','u','a'];
// a sung line; each note takes the next vowel so the line sounds like words. o.map transposes it (a harmony line)
function sing(t,beat,str,o={}){ let k=o.v0||0; const vs=o.vowels||VOW;
  playMel(t,beat,str,(tt,m,d)=>{ const mm=o.map?o.map(m):m+(o.tr||0); choirM(tt,mm,d*0.97,o.vol||0.07,{att:o.att||0.15,rel:o.rel||0.45,vowel:o.vowel||vs[(k++)%vs.length],voices:o.voices||4,pan:o.pan||0,vib:o.vib,wet:o.wet}); }); }
// octavist: the basses who sing an octave under the bass line; a little sine underneath for the weight you feel more than hear
function octavist(t,midi,dur,vol){ choirM(t,midi,dur,vol,{att:1,rel:1.2,vowel:'u',voices:3,vib:0,spread:6,pan:-0.1});
  const a=MUS.ctx, o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=mtof(midi); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol*1.4,t+1); g.gain.setValueAtTime(vol*1.4,t+Math.max(1,dur)); g.gain.linearRampToValueAtTime(0.0001,t+dur+1.2);
  o.connect(g); o.start(t); o.stop(t+dur+1.3); outNode(g,0,0.5); }
// a chord sung on each syllable: [[beats,'G2 D3 Bb3 D4'],...]
function respond(t,beat,seq,vol,vowels){ let tt=t; seq.forEach(([b,ch],j)=>{ chordM(ch).forEach((m,i)=>choirM(tt,m,b*beat*0.97,vol*(i===0?1.25:1),{att:0.12,rel:0.5,vowel:vowels[j%vowels.length],voices:3,pan:(i-1.5)*0.22})); tt+=b*beat; }); }
// perezvon: every bell struck once in turn, smallest to largest, over dur seconds (how a funeral is rung)
function perezvon(t,dur,bells,amt=1){ bells.forEach((n,j)=>{ const m=nm(n); bell(t+j*dur/bells.length,m,(m>=72?0.055:m>=55?0.065:0.085)*amt,{dec:m>=72?2.2:m>=55?4:9,pan:0.55-1.1*j/(bells.length-1)}); }); }
// a bell tower ringing in time: little bells in sixteenths, middle bells in one of three figures, the big bells on the strong beats
const TOWER_PATS=[[0,2,1,3,0,2,1,2,0,2,1,3,2,1,0,1],[0,-1,2,1,-1,3,0,-1,2,-1,1,3,-1,0,2,1],[0,1,2,3,2,1,0,1,0,1,2,3,3,2,1,0]];
function tower(t,bar,T,amt,variant=0){
  const B=bar/4, pat=TOWER_PATS[variant%3];
  for(let s=0;s<16;s++){ const ix=pat[s]; if(ix<0||(amt<0.6&&s%2)) continue; bell(t+s*B/4+(Math.random()-0.5)*0.01,nm(T.small[ix]),(s%4===0?0.05:0.032)*amt,{dec:1.6,pan:0.5-ix*0.25,wet:0.8}); }
  const mid=(b,j,v)=>bell(t+b*B,nm(T.mid[j]),0.07*amt*(v||1),{dec:3.2,pan:j?0.25:-0.3});
  if(variant%3===0) [0.5,1.5,2.5,3.5].forEach((b,j)=>mid(b,j%2));
  else if(variant%3===1) [[0.5,1],[0.75,0],[2.5,1],[2.75,0]].forEach(([b,j])=>mid(b,j));
  else [1,2,3].forEach((b,j)=>mid(b,j%2,b===2?1.2:1));
  bell(t,nm(T.big),0.16*amt,{dec:9}); if(variant%3!==2) bell(t+2*B,nm(T.big2),0.09*amt,{dec:6,pan:0.2}); else bell(t+2*B,nm(T.big),0.1*amt,{dec:7});
}

/* ---- Zvon (Long): Zvon at full length. The same opening, then the peal stays, a second chant joins it, and the
   ringer speeds up from 52 to 96 bpm with the choir riding on top, before slowing to the last bell (D minor) ---- */
const ZL={

function zlBpm(i){ if(i<28) return 52; if(i<52) return 52+(i-28)*(96-52)/23; return Math.max(56,96-(i-51)*10); }
const zvonLongBarAt=i=>4*60/zlBpm(i);

function zlChant(t,B,bar,mel,bass,o={}){
  const bs=nm(bass); choirM(t,bs,bar,0.06,{att:0.3,vowel:'o',voices:4}); choirM(t,bs-12,bar,0.03,{att:0.5,vowel:'u',vib:0}); choirM(t,bs+7,bar,0.03,{att:0.3,vowel:'o',pan:-0.25});

  const B=bar/4;

  if(i<36){ const k=i-28; // the peal alone, getting faster, over the drone
    tower(t,bar,ZL.set,0.85+k*0.02,k); choirM(t,nm('D2'),bar,0.05,{att:0.5,vowel:'u',voices:4}); choirM(t,nm('A2'),bar,0.03,{att:0.5,vowel:'u'}); octavist(t,nm('D1'),bar,0.02+k*0.003);
    if(k>=6) choirM(t+B*2,nm('D3'),B*2,0.035,{att:0.4,vowel:'o'}); return; }
  if(i<44){ const k=i-36; zlChant(t,B,bar,ZV.mel[k],ZV.bass[k],{oct:true}); tower(t,bar,ZL.set,0.72,k); return; }
  if(i<52){ const k=i-44; zlChant(t,B,bar,ZL.B[k],ZL.bassB[k],{oct:true,high:true,vol:0.075}); tower(t,bar,ZL.set,0.95,k); zlSparkle(t,bar,k<4?0.6:1);

/* 34-voices: people sound like people
   - Sounds placed in the world: louder when close, panned left or right by where they are relative to you, duller
     behind you and muffled through walls.
   - Footsteps for everyone you can see move (enemies and other players), one per foot as it lands (58-body.js
     counts them): snow crunch outside, hard taps on floors, louder running, nearly silent crouched; some kit rattle.
   - Voices: every enemy has its own voice (pitch and timbre) synthesized from vowel formants, so it sounds like
     speech you can't quite make out. They shout when they spot someone, call to their squad, mutter when they lose
     you, call a reload, grunt when hit and groan when they go down. Raiders and guards key a radio first. Calm ones
     cough, sniff and mutter on patrol.
   - You: a grunt when you're hit, a heartbeat when you're badly hurt, effort on hard landings (breathing is in
     61-player.js).
   - Locks: keys, picks, rattles and heavy doors (63-locks.js). */
const VOX={max:34, cool:3.5, global:0.9};
// a sound source in the world; returns the node to connect into, or null if it's too far to hear
function spatial(x,z,maxD,o={}){
  const a=MUS.ctx; if(!a||!P||!MUS.sfx) return null; const dx=x-P.pos.x, dz=z-P.pos.z, d=Math.hypot(dx,dz); if(d>maxD) return null;
  const rel=Math.atan2(-dx,-dz)-P.yaw, side=Math.sin(rel), front=Math.cos(rel);
  let occ=false; if(o.occl!==false&&d>2&&R&&R.ray){ try{ occ=!los(P.pos.x,P.y+P.eye,P.pos.z,x,(o.y||1.4)+(R.terrain?R.terrain(x,z):0),z); }catch(e){} }
  const g=a.createGain(); g.gain.value=Math.pow(Math.max(0,1-d/maxD),1.5)*(occ?0.55:1);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=occ?650:Math.max(900,(o.bright||7000)*(front<0?0.6:1)-d*70);
  g.connect(lp); let out=lp;
  if(a.createStereoPanner){ const pn=a.createStereoPanner(); pn.pan.value=clamp(-side*0.85,-1,1); out.connect(pn); out=pn; }
  out.connect(MUS.sfx); return g;
}

const VOX_VOWELS=[[730,1090,2440],[570,840,2410],[300,870,2240],[530,1840,2480],[270,2290,3010],[660,1700,2400]];

  const rad=(vx.radio&&shout)||L.radio;
  if(rad){ tn(dest,t,1700,0.04,V*0.35,'square'); nz(dest,t,0.12,2600,V*0.25,'bandpass',2); t+=0.12; }
  for(let i=0;i<n;i++){
    const dur=(shout?0.13:0.16)+Math.random()*0.1, vw=VOX_VOWELS[Math.floor(Math.random()*VOX_VOWELS.length)], p=(L.rise[0]+(L.rise[1]-L.rise[0])*i/Math.max(1,n-1))*(shout?1.25:1)*(0.95+Math.random()*0.1);
    // a consonant first, sometimes
    const c=Math.random(); if(c<0.3) nz(dest,t,0.05,4200,V*0.4,'bandpass',3); else if(c<0.55){ nz(dest,t,0.015,2500,V*0.6,'bandpass',1); } else if(c<0.7) tn(dest,t,vx.f0*p*0.8,0.04,V*0.3,'sine');

    const vib=a.createOscillator(), vg=a.createGain(); vib.frequency.value=5+Math.random()*2; vg.gain.value=vx.f0*0.02; vib.connect(vg); vg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(V*(shout?1:0.7),t+0.025); g.gain.setValueAtTime(V*(shout?0.9:0.6),t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0006,t+dur);
    for(const [k,fq] of vw.entries()){ const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fq*vx.fmt*(shout?1.08:1); bp.Q.value=6+k*2; const fg=a.createGain(); fg.gain.value=[1,0.6,shout?0.3:0.15][k]; o.connect(bp); bp.connect(fg); fg.connect(g); }

// calm noises: a cough, a sniff, a sigh

/* ---- watching everyone for things worth a sound ---- */
function charSoundsTick(dt){
  if(!MUS.ctx||!P) return; const now=R.t; const host=!NET.on||NET.host;

    if(e.dead){ if(!st.dead){ st.dead=true; if(d2<60*60) speak(e.pos.x,e.pos.z,voiceOf(e),'die',0.8); } continue; }
    if(d2>70*70){ if(rig) st.steps=rig.s.steps||0; continue; }
    // footsteps
    if(rig&&(rig.s.steps||0)!==st.steps){ st.steps=rig.s.steps||0; footAt(e.pos.x,e.pos.z,rig.s.v,rig.s.crouch>0.5,!!bldAt(e.pos.x,e.pos.z),e.k.boss); }
    // what it is doing now, from the AI (host) or from what the host sent us
    const b=e.np?e.np.b:0, alert=host?e.state==='combat':!!(b&4), sees=host?!!e.sees:!!(b&8), rl=host?e.reloadT>0:!!(b&2), hp=e.hp+e.headHp;

    if(hp<st.hp-0.5){ if(now>(st.hurtT||0)){ st.hurtT=now+0.6; speak(e.pos.x,e.pos.z,vx,'hurt'); } }
    else if(sees&&!st.sees) say(Math.random()<0.5?'spot':'call');
    else if(alert&&!st.alert) say('call');
    else if(rl&&!st.rl){ if(Math.random()<0.6) say('reload',2); const dest=spatial(e.pos.x,e.pos.z,22,{y:1.3}); if(dest){ const t=MUS.ctx.currentTime; tn(dest,t+0.3,900,0.04,0.12,'square'); tn(dest,t+1.1,650,0.05,0.14,'square'); } }
    else if(st.sees&&!sees&&alert&&Math.random()<0.4) say('lost',5);

    if((p.rig.s.steps||0)!==s.steps){ s.steps=p.rig.s.steps||0; footAt(p.g.position.x,p.g.position.z,p.rig.s.v,!!p.st.crouch||!!p.st.sneak,!!bldAt(p.g.position.x,p.g.position.z)); }
    if(p.st.hp!=null&&p.st.hp<s.hp-1) speak(p.g.position.x,p.g.position.z,voiceOf(p),'hurt'); s.hp=p.st.hp; }
  // you
  const hp=totalHP(); if(R.myHp!=null&&hp<R.myHp-1&&!P.dead&&now>(R.myHurtT||0)){ R.myHurtT=now+0.5; myGrunt(); } R.myHp=hp;
  if(!P.dead&&hp<154){ R.beatT=(R.beatT||0)-dt; if(R.beatT<=0){ const k=1-hp/154; R.beatT=1.05-0.35*k; sfxHeart(0.12+0.18*k); } }
}
function myGrunt(){ const a=MUS.ctx; if(!a) return; const t=a.currentTime, f=118; const o=a.createOscillator(), g=a.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(f*1.4,t); o.frequency.exponentialRampToValueAtTime(f*0.8,t+0.2);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0006,t+0.24);
  for(const [i,fq] of [700,1150,2500].entries()){ const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fq; bp.Q.value=7; const fg=a.createGain(); fg.gain.value=[1,0.5,0.15][i]; o.connect(bp); bp.connect(fg); fg.connect(g); }

/* 35-raid-music: a quiet score under the raid
   Not a tune to follow: a low pad that changes chord every ten seconds or so, a distant celesta or harp note now and
   then, all well under the wind. It listens to the raid:
   - calm: just the pad and the odd note;
   - someone is hunting you (an enemy alert nearby): a slow heartbeat drum and a cello drone come in;
   - a fight (you're seen, shot at, or shooting): a soft cello ostinato and frame drum push it along.
   It ducks under your own gunfire and fades back to calm a while after things go quiet. Each map has its own key.
   Settings → Music in raids: Off, Quiet (the default) or Normal; the music volume slider scales it too. */
const RAIDKEY={kaldfjord:[47,'dorian'],kolvik:[50,'dorian'],whiteout:[52,'minor'],skarsvik:[45,'minor'],ironfjord:[48,'minor'],vault:[46,'phrygian'],ravnskar:[43,'minor'],storvidda:[54,'minor'],skerries:[50,'minor'],hrimfell:[52,'dorian']};
const MODES={minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],phrygian:[0,1,3,5,7,8,10]};
// chord roots as scale degrees, two bars each: i – VI – iv – v (and a second half that leans on VII)
const RM_PROG=[[0,5,3,4],[0,6,5,4]];
const RM={on:false,timer:0,next:0,beat:0,int:0,beatLen:0.6,level:{off:0,quiet:0.17,normal:0.32}};
function rmScale(deg,oct=0){ const [root,mode]=RAIDKEY[R&&R.map]||[50,'minor'], sc=MODES[mode]; const d=((deg%7)+7)%7, o=Math.floor(deg/7); return root+sc[d]+12*(o+oct); }
function rmLevel(){ return (RM.level[OPTS.raidMusic||'quiet']||0)*(OPTS.musicVol!=null?OPTS.musicVol:0.8); }
function raidMusicStart(){
  const a=ensureAudio(); if(!a||RM.on||rmLevel()<=0) return; if(MUS.on) musicStop(0.4);
  RM.on=true; RM.beat=0; RM.int=0; RM.next=a.currentTime+0.3;
  MUS.master.gain.cancelScheduledValues(a.currentTime); MUS.master.gain.setValueAtTime(0,a.currentTime); MUS.master.gain.linearRampToValueAtTime(rmLevel(),a.currentTime+6);
  RM.timer=setInterval(rmSchedule,200);
}
function raidMusicStop(fade=0.6){
  if(!RM.on||!MUS.ctx) return; RM.on=false; clearInterval(RM.timer); const a=MUS.ctx;
  MUS.master.gain.cancelScheduledValues(a.currentTime); MUS.master.gain.setValueAtTime(MUS.master.gain.value,a.currentTime); MUS.master.gain.linearRampToValueAtTime(0,a.currentTime+fade);
  const old=MUS.master; setTimeout(()=>{ try{ old.disconnect(); }catch(e){} },fade*1000+50);
  MUS.master=a.createGain(); MUS.master.gain.value=0; MUS.master.connect(MUS.out); rebuildSends();
}
// how tense things are, 0 to 1, from what's going on around you
function raidMusicTick(dt){
  if(!RM.on){ if(R&&!R.paused&&rmLevel()>0&&MUS.ctx&&!R.over) raidMusicStart(); return; }
  if(rmLevel()<=0){ raidMusicStop(1); return; }
  if(P.kick>0.6) R.shotT=R.t;
  let target=0; const host=!NET.on||NET.host;
  for(const e of R.enemies){ if(e.dead) continue; const d=Math.hypot(e.pos.x-P.pos.x,e.pos.z-P.pos.z); if(d>90) continue;
    const alert=host?e.state==='combat':!!(e.np&&e.np.b&4), sees=host?(e.sees&&e.tgtId==='me'):!!(e.np&&e.np.b&8)&&d<60;
    if(sees){ target=1; break; } if(alert) target=Math.max(target,0.5); }
  if(R.t-(R.shotT||-99)<5||R.t-(R.lastHitT||-99)<6||(P.hurt||0)>0.3) target=1;
  if(R.boss&&R.boss.awake&&!R.bossDown) target=Math.max(target,0.8);
  RM.int+=(target-RM.int)*Math.min(1,dt*(target>RM.int?1.5:0.06));
  // duck under your own gunfire; a touch louder when it matters
  const a=MUS.ctx, duck=R.t-(R.shotT||-99)<0.5?0.55:1, lv=rmLevel()*(0.85+0.35*RM.int)*duck*(R.paused?0.6:1);
  if(Math.abs(MUS.master.gain.value-lv)>0.004&&a.currentTime>(RM.rampT||0)){ MUS.master.gain.setTargetAtTime(lv,a.currentTime,0.4); RM.rampT=a.currentTime+0.25; }
}
function rmSchedule(){
  const a=MUS.ctx; if(!a||!RM.on||!R) return; const B=RM.beatLen;
  while(RM.next<a.currentTime+1.5){ rmBeat(RM.beat,RM.next,B); RM.beat++; RM.next+=B; }
}
function rmBeat(i,t,B){
  const I=RM.int, bar=Math.floor(i/8), inBar=i%8, prog=RM_PROG[Math.floor(bar/8)%2], deg=prog[Math.floor(bar/2)%4];
  const root=rmScale(deg,-1), third=rmScale(deg+2,0), fifth=rmScale(deg+4,0);
  // the pad: a new chord every two bars, low and filtered
  if(inBar===0&&bar%2===0){ const dur=B*16+1; strings(t,root,dur,0.05); strings(t+0.3,third,dur,0.032); strings(t+0.6,fifth,dur,0.03); if(I>0.3) cello(t,root-12,dur-1,0.03+0.03*I,{att:1.5,rel:2}); }
  // now and then a far-off note from the scale, more often when it's calm
  if(Math.random()<(I<0.4?0.09:0.04)){ const m=rmScale([0,2,4,7,9][Math.floor(Math.random()*5)],1+(Math.random()<0.3?1:0)); if(Math.random()<0.55) celesta(t,m,0.035,{pan:(Math.random()-0.5)*0.8,dec:4}); else harp(t,m,0.05,(Math.random()-0.5)*0.8); }
  // hunted: a slow heartbeat
  if(I>0.35&&(inBar===0||inBar===1)) drum(t,(0.06+0.08*I)*(inBar?0.6:1),46);
  // fighting: a quiet ostinato on root and fifth, frame drum on one and five
  if(I>0.7){ const pat=[0,0,7,0,12,0,7,3], m=root+12+pat[inBar]; spicc(t,m,0.025+0.02*(I-0.7)*3); spicc(t+B/2,m,0.018); if(inBar===0||inBar===4) frameDrum(t,0.07,50); if(inBar===0&&bar%2===0) timpRoll(t,root-12,B*2,0.02,0.09); }
}

function sortStash(){
  const items=S.stash.items.slice(); const order=['weapon','armor','helmet','rig','pack','ammo','med','warm','relic','cash','loot'];

  const saved=items.map(i=>[i.x,i.y,i.r]); const tmp={w:S.stash.w,h:S.stash.h,items:[]};
  for(const it of items){ it.r=0; if(!placeNoMerge(tmp,it)){ items.forEach((x,i)=>{[x.x,x.y,x.r]=saved[i]}); toast('Could not sort: stash too full.'); return; } }
  S.stash.items=tmp.items; saveGame(); renderTab();
}
function placeNoMerge(c,it){ const g=occ(c); for(const r of [0,1]) for(let y=0;y<c.h;y++) for(let x=0;x<c.w;x++) if(fitsG(c,g,it.id,x,y,r)){ it.x=x; it.y=y; it.r=r; c.items.push(it); return true; } return false; }
function sellAllLoot(){
